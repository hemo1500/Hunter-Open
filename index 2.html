/* ---------- view ---------- */
const KF=[['all','الكل'],['w','سلاح'],['a','درع'],['c','تميمة'],['x','استهلاكي']];
const SO=[['new','الأحدث'],['cheap','الأرخص'],['pow','الأقوى'],['fit','يناسب طابقك']];
function power(it){return it.k==='w'||it.k==='a'||it.k==='c'?IK[it.k].p[it.r]:0;}
function card(lid,L,mine){
  const it=L.i,c=RAR[it.r].c,m=monster(S.army.floor),fit=(it.k==='w'||it.k==='a'||it.k==='c')&&it.s===m.w;
  const ref=refPrice(it),cheap=L.p<=ref*.8,age=Date.now()-(L.t||0);
  let act='';
  if(mine){act=L.b?'<span class="w" style="color:var(--ok)">اتباع</span>':'<button class="btn sm bad" data-act="xmcancel" data-id="'+esc(lid)+'">الغي</button>';}
  else{const ok=S.tc.cash>=L.p;act='<button class="btn sm fill'+(ui.xm.conf===lid?' bad':'')+'" data-act="xmbuy" data-id="'+esc(lid)+'" data-cost="'+L.p+'"'+(ok?'':' disabled')+'>'+(ui.xm.conf===lid?'تأكيد الشراء':'اشتري')+'</button>';}
  return '<div class="tcr" style="align-items:flex-start;border-inline-start:3px solid '+c+';padding-inline-start:10px"><div><div class="nmx" style="color:'+c+'">'+esc(itemName(it))+(fit?' <span class="gtag" style="margin:0">يناسب طابقك</span>':'')+'</div>'
   +'<div class="w">'+RAR[it.r].n+' · '+esc(itemDesc(it))+'</div>'
   +'<div class="w">'+(mine?'عرضك':'من '+esc(L.sn||'لاعب'))+' · '+(age>6048e5?'قديم':age>36e5?'من '+Math.floor(age/36e5)+' ساعة':'جديد')+(cheap&&!mine?' · <b style="color:var(--ok)">أرخص من المعتاد</b>':'')+'</div></div>'
   +'<div style="text-align:center;min-width:104px"><div class="num" style="color:var(--gold);font-weight:700;margin-bottom:6px">'+tcF(L.p)+'</div>'+act+'</div></div>';
}
window.vMarket=function(){
  if(window.FIREBASE_MISSING)return '<section class="panel"><p class="hint" style="margin:0">إعدادات Firebase ناقصة.</p></section>';
  if(!isM())return '<section class="panel"><div class="ptitle">سوق اللاعبين</div><p style="margin:0">السوق مفتوح لأعضاء الشبكة بس. ادخل كود الدخول من تبويب الجيش ثم الشبكة وارجع هنا.</p></section>';
  start();
  const x=ui.xm,u=me(),I=S.inv;let h='';
  if(x.sell){
    const it=ivFind(x.sell);
    if(it){
      const ref=refPrice(it);
      h+='<section class="panel"><div class="ptitle">اعرض في السوق</div><div class="nmx" style="color:'+RAR[it.r].c+'">'+esc(itemName(it))+'</div><div class="w">'+esc(itemDesc(it))+'</div>'
       +'<p class="hint">السعر المعتاد: <b class="num" style="color:var(--gold)">'+tcF(ref)+'</b>'+(medianFor(it.k,it.r)?' (من آخر صفقات)':' (تقدير)')+' · عمولة السوق '+Math.round(FEE*100)+'%</p>'
       +'<label class="lbl" for="xmp" style="margin-top:0">السعر (اكتب 5000 أو 20K أو 3M أو 2B)</label><input class="in lt" id="xmp" inputmode="text" autocomplete="off" value="'+esc(x.price||tcF(ref).replace(/\s/g,''))+'">'
       +'<div class="row" style="margin-top:12px"><button class="btn fill" data-act="xmconfirm" style="flex:1">اعرض</button><button class="btn" data-act="xmcancelsell" style="flex:1">إلغاء</button></div></section>';
    }else x.sell=null;
  }
  const all=Object.keys(X.l).map(k=>[k,X.l[k]]).filter(a=>a[1]&&typeof a[1]==='object'&&valid(a[1].i)&&a[1].p>0);
  const mine=all.filter(a=>a[1].s===u).sort((a,b)=>b[1].t-a[1].t);
  const oth=all.filter(a=>a[1].s!==u&&!a[1].b);
  h+='<section class="panel"><div class="ptitle">سوق اللاعبين<span class="sp"></span><span class="side num">'+oth.length+' عرض</span></div>'
   +'<p class="hint" style="margin:0 0 10px">غنايم البرج بتتباع هنا بين اللاعبين: الصيادين بيجيبوها، والتجار بيشتروها بفلوسهم. أنت بعت '+N(I.sold)+' واشتريت '+N(I.bought)+'.</p>'
   +'<div class="chips" style="margin-bottom:8px">'+KF.map(f=>'<button class="chip" data-act="xmf" data-v="'+f[0]+'" aria-pressed="'+(x.f===f[0])+'">'+f[1]+'</button>').join('')+'</div>'
   +'<div class="chips" style="margin-bottom:6px">'+SO.map(f=>'<button class="chip" data-act="xmsort" data-v="'+f[0]+'" aria-pressed="'+(x.sort===f[0])+'">'+f[1]+'</button>').join('')+'</div>';
  let list=oth.filter(a=>x.f==='all'||(x.f==='x'?['e','t','b'].includes(a[1].i.k):a[1].i.k===x.f));
  const m=monster(S.army.floor);
  list.sort((a,b)=>x.sort==='cheap'?a[1].p-b[1].p:x.sort==='pow'?power(b[1].i)-power(a[1].i)||b[1].i.r-a[1].i.r:x.sort==='fit'?((b[1].i.s===m.w)-(a[1].i.s===m.w))||b[1].i.r-a[1].i.r:b[1].t-a[1].t);
  h+=list.length?list.map(a=>card(a[0],a[1],false)).join(''):'<p class="hint">مفيش عروض هنا دلوقتي. اعرض أنت أول غرض.</p>';
  h+='</section>';
  h+='<section class="panel"><div class="ptitle">عروضي<span class="sp"></span><span class="side num">'+mine.filter(a=>!a[1].b).length+' / '+MAXL+'</span></div>'+(mine.length?mine.map(a=>card(a[0],a[1],true)).join(''):'<p class="hint" style="margin:0">ما عرضتش حاجة. افتح الحقيبة واختار "اعرضه في السوق".</p>')
   +'<button class="btn block" data-act="tcseg" data-v="inv" style="margin-top:10px">افتح الحقيبة</button></section>';
  const hist=Object.values(X.h).filter(z=>z&&z.p>0&&['w','a','c','e','t','b'].includes(z.k)&&z.r>=0&&z.r<=4).sort((a,b)=>b.t-a.t).slice(0,10);
  if(hist.length)h+='<section class="panel"><div class="ptitle">آخر الصفقات</div>'+hist.map(z=>'<div class="tcr"><div><div class="nmx" style="color:'+RAR[z.r].c+'">'+esc(itemName(z))+'</div><div class="w">'+esc(z.bn||'لاعب')+' اشترى من '+esc(z.sn||'لاعب')+'</div></div><span class="num" style="color:var(--gold);font-weight:700">'+tcF(z.p)+'</span></div>').join('')+'</section>';
  return h;
};
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;if(a.slice(0,2)!=='xm')return;
  const id=b.dataset.id,v=b.dataset.v,x=ui.xm;
  switch(a){
    case 'xmf':x.f=v;render();break;
    case 'xmsort':x.sort=v;render();break;
    case 'xmbuy':if(x.conf===id)buy(id);else{x.conf=id;toast('اضغط تاني لتأكيد الشراء');render();}break;
    case 'xmconfirm':listItem();break;
    case 'xmcancelsell':x.sell=null;render();break;
    case 'xmcancel':cancel(id);break;
  }
});
document.addEventListener('input',ev=>{const t=ev.target;if(t&&t.id==='xmp')ui.xm.price=t.value;});
})();
</script>
</body>
</html>
