<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04060d">
<title>نظام الصياد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one-column command panels with corner brackets, fixed bottom tab bar, a "System" window over deep navy. */
  --void:#04060d;
  --panel:#0a1226;
  --line:#21407a;
  --glow:#5ec2ff;
  --ink:#e3eeff;
  --mute:#8aa0c8;
  --gold:#f5c451;
  --ok:#4be3a8;
  --bad:#ff6b82;
  --display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  --num:'Chakra Petch','IBM Plex Sans Arabic',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--void);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(120% 55% at 50% -8%,#0f2d63 0%,rgba(15,45,99,0) 62%),
  repeating-linear-gradient(0deg,rgba(94,194,255,.035) 0 1px,transparent 1px 38px),
  repeating-linear-gradient(90deg,rgba(94,194,255,.035) 0 1px,transparent 1px 38px),
  var(--void)}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
.num{font-family:var(--num);direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(92px + env(safe-area-inset-bottom))}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;color:var(--glow);text-shadow:0 0 14px rgba(94,194,255,.45)}
.date{font-size:13px;color:var(--mute)}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mute);display:inline-block}
.sync[data-s="ok"] i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sync[data-s="err"] i{background:var(--bad)}

.panel{position:relative;background:linear-gradient(180deg,rgba(16,30,62,.82),rgba(9,17,36,.88));border:1px solid var(--line);border-radius:3px;padding:16px;margin-bottom:14px}
.panel::before,.panel::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--glow);pointer-events:none;filter:drop-shadow(0 0 4px rgba(94,194,255,.7))}
.panel::before{top:-2px;inset-inline-start:-2px;border-inline-end:0;border-bottom:0}
.panel::after{bottom:-2px;inset-inline-end:-2px;border-inline-start:0;border-top:0}
.ptitle{font-family:var(--display);font-weight:500;font-size:15px;color:var(--glow);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.ptitle::before{content:"";width:7px;height:7px;background:var(--glow);transform:rotate(45deg);box-shadow:0 0 8px var(--glow)}
.ptitle .sp{flex:1}
.ptitle .side{font-family:var(--body);font-size:13px;color:var(--mute);font-weight:400}

.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.rank{width:84px;height:84px;border:2px solid var(--glow);display:grid;place-items:center;position:relative;background:rgba(94,194,255,.07);box-shadow:inset 0 0 22px rgba(94,194,255,.18),0 0 18px rgba(94,194,255,.2);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.rank span{font-family:var(--num);font-weight:700;font-size:46px;line-height:1;color:#fff;text-shadow:0 0 16px var(--glow)}
.rank small{position:absolute;bottom:3px;font-size:10px;color:var(--mute)}
.who{min-width:0}
.nm{background:none;border:0;padding:0;font-family:var(--display);font-weight:700;font-size:22px;color:var(--ink);text-align:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.nm-in{width:100%;background:rgba(94,194,255,.08);border:1px solid var(--glow);border-radius:3px;padding:6px 10px;font-size:18px;outline:none}
.ttl{font-size:13px;color:var(--mute);margin-bottom:6px}
.lvrow{display:flex;align-items:baseline;gap:8px}
.lvrow .big{font-size:34px;font-weight:700;line-height:1;color:#fff;text-shadow:0 0 14px rgba(94,194,255,.6)}
.lvrow span.l{font-size:14px;color:var(--mute)}
.bar{height:9px;background:rgba(94,194,255,.1);border:1px solid rgba(94,194,255,.25);border-radius:2px;overflow:hidden;position:relative}
.bar>b{display:block;height:100%;background:linear-gradient(90deg,#2b7bd6,var(--c,var(--glow)));box-shadow:0 0 10px var(--c,var(--glow));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.barcap{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:5px}
.herobar{grid-column:1/-1}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{border:1px solid var(--line);background:rgba(10,18,38,.8);border-radius:3px;padding:10px 8px;text-align:center}
.tile .v{font-size:24px;font-weight:700;line-height:1.1;display:flex;align-items:center;justify-content:center;gap:5px}
.tile .k{font-size:12px;color:var(--mute);margin-top:4px}
.coin{width:16px;height:16px;flex:none}

.statrow{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;margin-top:12px}
.statrow .n{font-size:14px}
.statrow .lv{font-size:14px;font-weight:700;min-width:40px;text-align:end}
.radar{display:block;width:100%;height:auto;max-height:290px}
.radar text{fill:var(--ink);font-family:var(--body);font-size:13px}
.radar text.nn{font-family:var(--num);font-size:12px;fill:var(--glow)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:112px}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.wk .b{width:100%;max-width:26px;background:rgba(94,194,255,.28);border:1px solid rgba(94,194,255,.45);border-radius:2px 2px 0 0}
.wk.today .b{background:var(--glow);box-shadow:0 0 12px var(--glow)}
.wk .v{font-size:11px;color:var(--mute)}
.wk .d{font-size:11px;color:var(--mute)}
.wk.today .d{color:var(--glow)}

.log{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.log li{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px dashed rgba(94,194,255,.18);padding-bottom:8px}
.log li:last-child{border-bottom:0;padding-bottom:0}
.log .w{color:var(--mute);font-size:12px}
.log .g{color:var(--gold)}

.intro{border-color:var(--glow)}
.intro p{margin:0 0 12px;color:var(--ink)}

.btn{min-height:46px;padding:10px 16px;border:1px solid var(--glow);background:rgba(94,194,255,.08);color:var(--glow);border-radius:3px;font-weight:600;font-size:15px}
.btn:active{background:rgba(94,194,255,.22)}
.btn.fill{background:var(--glow);color:#03101f;box-shadow:0 0 18px rgba(94,194,255,.35)}
.btn.fill:active{background:#9ad8ff}
.btn.bad{border-color:var(--bad);color:var(--bad);background:rgba(255,107,130,.08)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:42px;padding:8px 14px;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:3px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--glow);color:var(--ink);background:rgba(94,194,255,.14);box-shadow:inset 0 0 12px rgba(94,194,255,.15)}
.lbl{display:block;font-size:13px;color:var(--mute);margin:14px 0 8px}
.in{width:100%;min-height:46px;background:rgba(94,194,255,.06);border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-size:16px;outline:none}
.in:focus{border-color:var(--glow);box-shadow:0 0 0 2px rgba(94,194,255,.2)}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

.qhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.qhead h2{margin:0;font-family:var(--display);font-size:24px;font-weight:700}
.qhead .cnt{font-size:28px;font-weight:700;color:var(--glow);text-shadow:0 0 12px rgba(94,194,255,.5)}
.bonus{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);margin:10px 0 0}
.bonus.got{color:var(--gold)}
.qs{display:grid;gap:10px;margin-bottom:14px}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:start;min-height:64px;padding:10px 14px;border:1px solid var(--line);background:rgba(10,18,38,.85);border-radius:3px}
.q:active{background:rgba(94,194,255,.1)}
.chk{width:28px;height:28px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);background:rgba(94,194,255,.05)}
.q[aria-pressed="true"]{border-color:var(--glow);background:rgba(94,194,255,.1);box-shadow:0 0 16px rgba(94,194,255,.15)}
.q[aria-pressed="true"] .chk{background:var(--glow);border-color:var(--glow);color:#03101f}
.q[aria-pressed="true"] .qt b{color:var(--mute)}
.qt{min-width:0;display:flex;flex-direction:column;gap:2px}
.qt b{font-weight:500;font-size:16px}
.qt i{font-style:normal;font-size:12px;color:var(--c,var(--mute))}
.xp{font-weight:700;color:var(--glow);font-size:17px}
.q.edit{cursor:default}
.hint{font-size:13px;color:var(--mute);margin:0 0 14px}

.ringwrap{display:grid;place-items:center;margin:6px 0 4px;position:relative}
.ring{width:240px;height:240px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .tr{stroke:rgba(94,194,255,.14)}
.ring .ar{stroke:var(--glow);stroke-linecap:round;filter:drop-shadow(0 0 7px var(--glow));transition:stroke-dashoffset .5s linear}
.ringin{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.ringin .t{font-family:var(--num);font-size:50px;font-weight:700;line-height:1;direction:ltr;text-shadow:0 0 18px rgba(94,194,255,.55)}
.ringin .s{font-size:13px;color:var(--mute)}
.est{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mute);margin:16px 0 14px}
.est b{color:var(--ink);font-weight:500}

.gold-big{display:flex;align-items:center;gap:10px;font-size:40px;font-weight:700;color:var(--gold);text-shadow:0 0 16px rgba(245,196,81,.4)}
.gold-big .coin{width:30px;height:30px}
.rw{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed rgba(94,194,255,.18)}
.rw:last-child{border-bottom:0}
.rw .t{font-size:16px}
.rw .c{display:flex;align-items:center;gap:5px;color:var(--gold);font-weight:700;font-size:14px;margin-top:2px}

.ex{padding:0}
.exh{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:start;background:none;border:0;padding:16px}
.et{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.35}
.ed{font-size:13px;color:var(--mute);margin-top:3px}
.cd{text-align:center;min-width:70px}
.cd .d{font-size:38px;font-weight:700;line-height:1;color:var(--c,var(--glow));text-shadow:0 0 14px var(--c,var(--glow))}
.cd .d.w{font-family:var(--display);font-size:22px}
.cd .u{font-size:12px;color:var(--mute);margin-top:2px}
.exb{padding:0 16px 16px}
.ex.past{opacity:.55}
.tgt{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin:12px 0}
.tgt b{color:var(--glow);font-weight:600}
.grp{font-family:var(--display);font-size:14px;color:var(--glow);margin:16px 0 8px;direction:ltr;text-align:start}
.tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.tt i{font-style:normal;font-size:12px;color:var(--mute)}
.un .xp{font-size:15px}
.un{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:start;min-height:48px;padding:8px 12px;border:1px solid var(--line);background:rgba(10,18,38,.85);border-radius:3px;margin-bottom:8px}
.un .chk{width:22px;height:22px}
.un[aria-pressed="true"]{border-color:var(--glow);background:rgba(94,194,255,.1)}
.un[aria-pressed="true"] .chk{background:var(--glow);border-color:var(--glow);color:#03101f}
.un[aria-pressed="true"] .t{color:var(--mute)}
.un.edit{grid-template-columns:1fr auto}
textarea.in{min-height:130px;resize:vertical;line-height:1.7}
.nextbn{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:start;background:none;border:0;padding:0;color:inherit}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}
.segb{min-height:44px;background:none;border:0;color:var(--mute);font-size:15px}
.segb+.segb{border-inline-start:1px solid var(--line)}
.segb[aria-pressed="true"]{background:rgba(94,194,255,.16);color:var(--ink);box-shadow:inset 0 -2px 0 var(--glow)}
.tree{display:grid;gap:12px;margin-bottom:14px}
.nd{display:grid;grid-template-columns:26px 1fr;gap:10px}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:-12px;width:2px;background:var(--line)}
.nd:last-child .rail::before{bottom:50%}
.dot{position:relative;margin-top:18px;width:14px;height:14px;transform:rotate(45deg);border:2px solid var(--line);background:var(--void)}
.nd.open .dot{border-color:var(--glow);box-shadow:0 0 10px var(--glow)}
.nd.done .dot{background:var(--glow);border-color:var(--glow);box-shadow:0 0 10px var(--glow)}
.nd.locked{opacity:.6}
.ndc{border:1px solid var(--line);background:rgba(10,18,38,.85);border-radius:3px;min-width:0}
.nd.open .ndc{border-color:rgba(94,194,255,.55)}
.nd.done .ndc{border-color:var(--glow);background:rgba(94,194,255,.08)}
.ndh{display:grid;grid-template-columns:1fr auto;gap:4px 10px;width:100%;text-align:start;background:none;border:0;padding:12px 14px}
.ndt{font-weight:600;font-size:16px}
.nds{grid-column:1/-1;font-size:12px;color:var(--mute)}
.ndb{padding:0 14px 14px}
.ndb p{margin:0 0 12px;font-size:15px}
.proof{border:1px dashed var(--gold);border-radius:3px;padding:10px 12px;margin:12px 0;font-size:14px}
.proof b{color:var(--gold);font-weight:600;display:block;margin-bottom:3px;font-size:13px}
.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mt .v{font-size:19px;justify-content:center}
.cat{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;margin-top:10px;font-size:14px}
.tx{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed rgba(94,194,255,.18)}
.tx:last-child{border-bottom:0}
.tx .a{font-weight:700;font-size:16px}
.tx .w{font-size:12px;color:var(--mute)}
.a.in{color:var(--ok)}.a.out{color:var(--bad)}.a.save,.a.inv{color:var(--glow)}
.big2{font-size:30px;font-weight:700;line-height:1.1}
.pwbig{font-size:46px;font-weight:700;line-height:1;color:#fff;text-shadow:0 0 18px var(--glow)}
.brk{display:grid;gap:6px;margin-top:12px;font-size:14px}
.brk div{display:flex;justify-content:space-between;gap:10px;color:var(--mute)}
.brk b{color:var(--ink);font-weight:500}
.mon{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.mon svg{width:96px;height:96px;display:block}
.flo{font-size:12px;color:var(--mute)}
.mn{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.3}
.mn.boss{color:var(--bad)}
.vd{margin:12px 0;padding:10px 12px;border-radius:3px;font-size:14px;border:1px solid var(--line)}
.vd.ok{border-color:var(--ok);color:var(--ok)}
.vd.no{border-color:var(--bad);color:var(--bad)}
.arena{display:grid;gap:12px}
.ftr{display:grid;gap:5px}
.ftr .h{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.amon{display:grid;place-items:center}
.amon svg{width:130px;height:130px}
.hit{animation:hit .35s}
@keyframes hit{0%{transform:none}25%{transform:translateX(-7px) rotate(-3deg)}55%{transform:translateX(6px) rotate(2deg)}100%{transform:none}}
.blog{min-height:44px;text-align:center;font-size:15px;color:var(--ink)}
.res{text-align:center;padding:6px 0}
.res .t{font-family:var(--display);font-weight:700;font-size:26px}
.res.win .t{color:var(--ok);text-shadow:0 0 14px rgba(75,227,168,.5)}
.res.lose .t{color:var(--bad)}
.shd{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed rgba(94,194,255,.18)}
.shd:last-child{border-bottom:0}
.rb{width:40px;height:40px;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:20px;border:1.5px solid var(--glow);color:var(--glow);background:rgba(94,194,255,.08);clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.rb[data-r="A"],.rb[data-r="S"]{border-color:var(--gold);color:var(--gold);background:rgba(245,196,81,.1)}
.rb[data-r="E"],.rb[data-r="D"]{border-color:var(--line);color:var(--mute)}
.shd .w{font-size:12px;color:var(--mute)}
#qz{position:fixed;inset:0;z-index:50;display:none;background:rgba(3,6,14,.97);overflow-y:auto;-webkit-overflow-scrolling:touch}
#qz.on{display:block}
.qzw{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(30px + env(safe-area-inset-bottom))}
.qzt{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.qzu{font-family:var(--num);font-size:18px;font-weight:700;direction:ltr;text-align:left;line-height:1.35}
.qq{direction:ltr;text-align:left;font-size:17px;font-weight:600;line-height:1.5;margin:6px 0 14px}
.qtag{display:flex;gap:6px;margin-bottom:6px}.qtag b{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--gold,#c9a227);color:#111}
.ans{direction:ltr;text-align:left;white-space:pre;overflow-x:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:rgba(94,194,255,.05);border:1px solid var(--line);border-radius:3px;padding:12px;margin:0 0 10px;color:var(--ink)}
.ans.wrap{white-space:pre-wrap;word-break:break-word}
.src{font-size:12px;color:var(--mute);margin-bottom:12px}
.src .e{direction:ltr;text-align:left}
.opt{display:block;width:100%;direction:ltr;text-align:left;min-height:50px;padding:10px 14px;margin-bottom:8px;border:1px solid var(--line);background:rgba(10,18,38,.85);border-radius:3px;font-size:15px;line-height:1.4}
.opt.ok{border-color:var(--ok);background:rgba(75,227,168,.12);color:var(--ok)}
.opt.no{border-color:var(--bad);background:rgba(255,107,130,.1);color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.exp{direction:ltr;text-align:left;font-size:14px;color:var(--ink);border-inline-start:3px solid var(--glow);padding:6px 10px;margin:4px 0 14px;background:rgba(94,194,255,.06)}
.vlab{font-size:15px;font-weight:600;margin:4px 0}
.vlab.ok{color:var(--ok)}.vlab.no{color:var(--bad)}
.met{border:1px solid var(--ok);border-radius:3px;padding:12px;margin-bottom:14px}
.met p{margin:0 0 10px;color:var(--ok)}
textarea.lt{direction:ltr;text-align:left}

<script>
/* الصق هنا إعدادات Firebase بتاعتك (Project settings > Your apps > Config) */
window.FIREBASE_CONFIG = {

  authDomain: "PASTE_PROJECT.firebaseapp.com",

<script>
/* Standalone adapter: gives the game the same small API it uses on claude.ai (db, user, room),
   backed by Firebase Anonymous Auth + Realtime Database. */
(function(){
  window.STANDALONE=true;
  var CFG=window.FIREBASE_CONFIG;
  var ready=null,ok=!!(CFG&&CFG.apiKey&&CFG.databaseURL&&window.firebase&&CFG.apiKey.indexOf('PASTE')<0);
  if(!ok){window.FIREBASE_MISSING=true;window.claude={use:function(){return Promise.resolve(null);}};return;}
  firebase.initializeApp(CFG);
  var auth=firebase.auth(),rtdb=firebase.database();
  function waitUser(){
    if(ready)return ready;
    ready=new Promise(function(res){
      var done=false;
      auth.onAuthStateChanged(function(u){
        if(u&&!done){done=true;res(u);}
        else if(!u)auth.signInAnonymously().catch(function(){if(!done){done=true;res(null);}});
      });
      setTimeout(function(){if(!done){done=true;res(null);}},12000);
    });
    return ready;
  }
  var safe=function(k){return String(k).replace(/[.#$\[\]\/]/g,'_');};
  /* ---- db: documents stored as JSON strings to keep arrays and keys intact ---- */
  function pathOf(p){
    var s=p.split('/');
    if(s[0]==='data'&&s[1]==='users')return 'users/'+safe(s[2]);
    if(s[0]==='league')return 'lg/'+safe(s[1]);
    return null;
  }
  function wrap(snap){var v=snap.val(),d=null;if(v&&typeof v.j==='string'){try{d=JSON.parse(v.j);}catch(e){}}return {exists:!!d,data:function(){return d;},metadata:{fromCache:false,hasPendingWrites:false}};}
  var dbApi={
    doc:function(p){
      var rp=pathOf(p);
      return {path:p,
        get:function(){if(!rp)return Promise.resolve({exists:false,data:function(){}});return rtdb.ref(rp).get().then(wrap);},
        set:function(d){if(!rp)return Promise.reject({code:'invalid_argument',message:'not available'});return rtdb.ref(rp).set({j:JSON.stringify(d),t:firebase.database.ServerValue.TIMESTAMP}).catch(function(e){throw {code:'invalid_argument',message:String(e&&e.message||e)};});},
        onSnapshot:function(next,err){if(!rp){setTimeout(function(){next({exists:false,data:function(){}});},0);return function(){};}
          var r=rtdb.ref(rp),cb=function(s){next(wrap(s));};r.on('value',cb,function(e){err&&err({code:'unavailable',message:String(e)});});return function(){r.off('value',cb);};}
      };
    },
    collection:function(p){
      return {onSnapshot:function(next,err){
        if(p!=='league'){setTimeout(function(){next({docs:[]});},0);return function(){};}
        var r=rtdb.ref('lg'),cb=function(s){var docs=[];s.forEach(function(c){var w=wrap(c);if(w.exists)docs.push({id:c.key,data:w.data});});next({docs:docs});};
        r.on('value',cb,function(e){err&&err({code:'unavailable',message:String(e)});});return function(){r.off('value',cb);};
      }};
    }
  };
  /* ---- room: presence nodes with onDisconnect cleanup ---- */
  function makeRoom(base,uid){
    var me={},peersCbs=[],last={},cache=[],ref=rtdb.ref(base),mine=rtdb.ref(base+'/'+uid),listening=false;
    function build(s){
      var out=[];
      s.forEach(function(c){var p={};try{p=JSON.parse(c.val().p)||{};}catch(e){}
        var key=c.key,raw=c.val().p;
        if(!last[key]||last[key].raw!==raw)last[key]={raw:raw,at:Date.now()};
        out.push({peer:key,by:key,isMe:key===uid,sameTab:key===uid,kind:'viewer',guest:false,presence:Object.freeze(p),updatedAt:last[key].at});});
      return out;
    }
    function listen(){if(listening)return;listening=true;
      ref.on('value',function(s){cache=build(s);peersCbs.forEach(function(cb){cb({peers:cache,joined:[],left:[],updated:[]});});});}
    mine.onDisconnect().remove();
    return {
      name:base,
      presence:function(patch){for(var k in patch){if(patch[k]===null)delete me[k];else me[k]=patch[k];}
        return mine.set({p:JSON.stringify(me),t:firebase.database.ServerValue.TIMESTAMP}).catch(function(){});},
      onPeers:function(cb){peersCbs.push(cb);listen();setTimeout(function(){cb({peers:cache,joined:[],left:[],updated:[]});},0);return function(){};},
      peers:function(){return cache;},
      onConnection:function(cb){var r=rtdb.ref('.info/connected');r.on('value',function(s){cb(!!s.val());});return function(){};},
      connected:function(){return true;},
      leave:function(){ref.off();peersCbs=[];mine.onDisconnect().cancel();return mine.remove().catch(function(){});}
    };
  }
  /* ---- join code: league, presence and duels need a members/<uid> record that matches secret/code ---- */
  window.HUNTER={state:'checking',listeners:[],
    _set:function(st){this.state=st;this.listeners.forEach(function(f){try{f(st);}catch(e){}});},
    onChange:function(f){this.listeners.push(f);},
    join:function(code){return waitUser().then(function(u){if(!u)throw 0;return rtdb.ref('members/'+u.uid).set(String(code).trim());});},
    setCode:function(code){return waitUser().then(function(u){if(!u)throw 0;return rtdb.ref('secret/code').set(String(code).trim());});}};
  window.HUNTER.db={
    on:function(p,cb){var r=rtdb.ref(p),f=function(s){cb(s.val());};r.on('value',f,function(){cb(null);});return function(){r.off('value',f);};},
    set:function(p,v){return rtdb.ref(p).set(v);},
    update:function(o){return rtdb.ref().update(o);},
    key:function(p){return rtdb.ref(p).push().key;},
    uid:function(){return auth.currentUser?auth.currentUser.uid:null;}
  };
  var memberReady=waitUser().then(function(u){window.HUNTER._set(u?'member':'offline');});
  var lobby=null;
  window.claude={use:function(name){
    return waitUser().then(function(u){
      if(!u)return null;
      if(name==='db')return dbApi;
      if(name==='user')return {id:function(){return Promise.resolve(u.uid);},isOwner:function(){return Promise.resolve(false);},canEdit:function(){return Promise.resolve(false);},can:function(){return Promise.resolve(null);}};
      if(name==='room'){
        return memberReady.then(function(){
        if(window.HUNTER.state!=='member')return null;
        if(!lobby){lobby=makeRoom('pr',u.uid);
          lobby.join=function(n){if(!/^[a-z0-9][a-z0-9_-]{0,47}$/.test(n))return Promise.reject({code:'invalid_argument'});return Promise.resolve(makeRoom('dl/'+n,u.uid));};}
        return lobby;
        });
      }
      return null;
    });
  }};
  /* ---- account: link to Google so progress survives a new phone ---- */
  window.addEventListener('DOMContentLoaded',function(){
    var top=document.querySelector('.top');if(!top)return;
    var b=document.createElement('button');b.className='btn sm';b.id='gbtn';b.style.marginInlineStart='auto';b.style.marginInlineEnd='10px';
    function label(){var u=auth.currentUser;b.textContent=u&&!u.isAnonymous?'حسابك محفوظ':'احفظ تقدمك بجوجل';b.disabled=!!(u&&!u.isAnonymous);}
    auth.onAuthStateChanged(label);label();
    b.addEventListener('click',function(){
      var prov=new firebase.auth.GoogleAuthProvider(),u=auth.currentUser;
      if(!u)return;
      u.linkWithPopup(prov).then(function(){label();if(window.toast)toast('اتربط حسابك بجوجل');})
      .catch(function(e){
        if(e&&e.code==='auth/credential-already-in-use'&&e.credential){
          auth.signInWithCredential(e.credential).then(function(){try{localStorage.removeItem('hunter-system.v1');}catch(x){}location.reload();});
        }else if(window.toast)toast('ما قدرتش أربط الحساب. اتأكد إن دخول جوجل متفعّل في Firebase.');
      });
    });
    top.insertBefore(b,document.getElementById('sync'));
  });
})();
</script>

function totals(){

function lvl(xp,need){let l=1,r=xp;while(r>=need(l)){r-=need(l);l++;}return {l,cur:r,need:need(l)};}

/* Folds old, low-value entries into S.base so the saved document stays small. Units, bosses and skills are kept. */
function compact(){
  if(S.entries.length<=700)return;
  const cut=dayKey(daysAgo(45)),keep=[];
  S.entries.forEach(e=>{
    if(e.day<cut&&e.kind!=='unit'&&e.kind!=='boss'){

}
function countsByDay(){const c={};for(const e of S.entries){if(e.kind==='quest'||e.kind==='dungeon')c[e.day]=(c[e.day]||0)+1;else if(e.kind==='gym'&&e.fin)c[e.day]=(c[e.day]||0)+3;}return c;}
function streakBefore(){

  while((c[dayKey(daysAgo(i))]||0)>=3){n++;i++;}
  return n;
}
function streakNow(){const c=countsByDay();return streakBefore()+((c[dayKey()]||0)>=3?1:0);}

async function connect(){

    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('t')),7000));
    const snapd=await Promise.race([ref.get(),timeout]);

function tick(){
  liveTick();
  if(ui.day!==dayKey()){ui.day=dayKey();render();return;}

function bar(cur,need,c){return '<div class="bar" style="--c:'+(c||'var(--glow)')+'"><b style="width:'+Math.max(2,Math.min(100,cur/need*100)).toFixed(1)+'%"></b></div>';}

function radar(T){
  const cx=150,cy=125,R=86;
  const lv=STATS.map(s=>lvl(T.s[s.id],needStat).l);
  const cap=Math.max(5,Math.max.apply(null,lv)+1);
  const ang=i=>-Math.PI/2+i*2*Math.PI/5;
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  const poly=f=>STATS.map((s,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ');
  let g='';
  [1/3,2/3,1].forEach(f=>{g+='<polygon points="'+poly(f)+'" fill="none" stroke="rgba(94,194,255,.22)" stroke-width="1"/>';});
  STATS.forEach((s,i)=>{const p=pt(i,R);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="rgba(94,194,255,.18)"/>';});
  const dp=STATS.map((s,i)=>pt(i,R*lv[i]/cap).map(v=>v.toFixed(1)).join(',')).join(' ');
  g+='<polygon points="'+dp+'" fill="rgba(94,194,255,.24)" stroke="#5ec2ff" stroke-width="2" filter="url(#gl)"/>';
  STATS.forEach((s,i)=>{const p=pt(i,R*lv[i]/cap);g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="'+s.c+'"/>';});
  STATS.forEach((s,i)=>{
    const p=pt(i,R+24);
    g+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+(i===0?-2:3)).toFixed(1)+'" text-anchor="middle">'+s.name+'</text>';
    g+='<text class="nn" x="'+p[0].toFixed(1)+'" y="'+(p[1]+(i===0?-2:3)+15).toFixed(1)+'" text-anchor="middle">'+lv[i]+'</text>';
  });
  return '<svg class="radar" viewBox="0 0 300 262" role="img" aria-label="مخطط القدرات"><defs><filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+g+'</svg>';
}

/* ---------- money ledger ---------- */
const LT={out:'مصروف',in:'دخل',save:'توفير',inv:'استثمار'};
const LSUB={out:['أكل','مواصلات','سكن','دراسة','اشتراكات','ترفيه','المشروع','أخرى'],in:['راتب','شغل جانبي','أخرى'],save:['طوارئ','عام'],inv:['أسهم','ذهب','شهادات','أخرى']};
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const monthOf=k=>k.slice(0,7);
function ledgerSum(mk){
  const o={in:0,out:0,save:0,inv:0,nonSalary:0,cats:{}};
  S.ledger.forEach(t=>{
    if(monthOf(t.day)!==mk)return;
    o[t.type]+=t.amt;
    if(t.type==='in'&&t.sub!=='راتب')o.nonSalary+=t.amt;
    if(t.type==='out')o.cats[t.sub]=(o.cats[t.sub]||0)+t.amt;
  });
  return o;
}
function efInfo(){
  const saved=S.ledger.filter(t=>t.type==='save'&&t.sub==='طوارئ').reduce((a,t)=>a+t.amt,0);
  const mons={};
  S.ledger.forEach(t=>{if(t.type==='out'){const m=monthOf(t.day);mons[m]=(mons[m]||0)+t.amt;}});
  const keys=Object.keys(mons).sort().slice(-3);
  const avg=keys.length?keys.reduce((a,k)=>a+mons[k],0)/keys.length:0;
  return {saved,avg,target:avg*3};
}

/* ---------- shadow army & monster tower ----------
   Power comes only from real progress: stat levels, overall level, and shadows.
   Shadows are derived from achievements; fighting gives no XP or gold. */
const ARCH={code:'ساحر الكود',create:'رامي العدسة',money:'حارس الخزنة',study:'فارس المعرفة'};
function shRank(p){return p>=220?'S':p>=160?'A':p>=110?'B':p>=70?'C':p>=40?'D':'E';}
function dDiff(a,b){const x=a.split('-'),y=b.split('-');return Math.round((new Date(+y[0],+y[1]-1,+y[2],12)-new Date(+x[0],+x[1]-1,+x[2],12))/864e5);}
function bestStreak(){
  const c=countsByDay(),ks=Object.keys(c).filter(k=>c[k]>=3).sort();
  let best=0,run=0,prev=null;
  ks.forEach(k=>{run=prev&&dDiff(prev,k)===1?run+1:1;best=Math.max(best,run);prev=k;});
  return Math.max(best,S.army.bestStreak||0);
}
function shadows(){
  const out=[],T=totals();
  EXAMS0.forEach(ex=>{
    if(bossBeaten(ex.id)){const w=examStats(ex).total;out.push({id:'bs_'+ex.id,name:'جنرال '+ex.title,p:Math.min(260,150+Math.round(w/4)),src:'هزمت زعيم امتحان '+ex.title+' ('+ex.sub.split(':')[0]+')'});}
  });
  STATS.forEach(st=>{
    const L=lvl(T.s[st.id],needStat).l;
    for(let m=5;m<=L;m+=5)out.push({id:'st_'+st.id+'_'+m,name:'جندي '+st.name,p:20+m*6,src:'وصلت مستوى '+m+' في '+st.name});
  });
  Object.keys(GX).forEach(x=>{const rk=gyRank(x,gyBest(x).v);for(let r=2;r<=rk;r++)out.push({id:'gy_'+x+'_'+r,name:'حارس '+GX[x].n,p:[0,0,40,70,110,170][r],src:'رتبة '+ERK[r]+' في '+GX[x].n});});
  {const lm=lnMast();for(let k=1;k<=Math.floor(lm/20);k++)out.push({id:'ln_'+k,name:'حارس الكلمات '+k,p:Math.min(120,15+k*10),src:(k*20)+' كلمة متثبتة في الإنجليزي'});}
  S.mv.goals.forEach(g=>{if(g.done)out.push({id:'mg_'+g.id,name:'ظل '+g.n,p:40,src:'حققت هدف ادخار'});});
  S.rd.bk.forEach(b=>{if(b.boss)out.push({id:'bk_'+b.id,name:'ظل '+b.t,p:50,src:'هزمت زعيم الكتاب'});});
  STORIES.forEach(st=>{if(rdFound(st)===rdEnds(st).length)out.push({id:'st_'+st.id,name:'ظل '+st.t,p:60,src:'فتحت كل نهايات القصة'});});
  const bs=bestStreak();
  [[7,60],[14,100],[30,180],[60,240]].forEach(x=>{if(bs>=x[0])out.push({id:'sr_'+x[0],name:'حارس السلسلة',p:x[1],src:x[0]+' يوم متتالي'});});
  out.forEach(x=>x.r=shRank(x.p));
  return out.sort((a,b)=>b.p-a.p);
}
function power(){
  const T=totals(),A=lvl(T.xp,needAll);let sl=0;
  STATS.forEach(x=>sl+=lvl(T.s[x.id],needStat).l);
  const sh=shadows(),sp=sh.reduce((a,x)=>a+x.p,0);
  return {stats:sl*12,lvl:A.l*15,sh:sp,n:sh.length,list:sh,total:sl*12+A.l*15+sp,T};
}
const MON=[
  {n:'عفريت التأجيل',w:'study',h:280},{n:'ذئب الكسل',w:'body',h:30},{n:'غول السوشيال ميديا',w:'create',h:200},
  {n:'شبح التشتت',w:'study',h:170},{n:'عنكبوت السهر',w:'body',h:260},{n:'ضبع الإنفاق',w:'money',h:45},
  {n:'تنين الملل',w:'code',h:120},{n:'ساحر الأعذار',w:'money',h:300},{n:'عملاق الخوف',w:'create',h:330},
  {n:'ملك الفوضى',w:'code',h:0}

const TIERS=['','المتطور','المدرّع','الأسطوري','الملكي'];
function monster(f){
  const i=(f-1)%10,t=Math.floor((f-1)/10),b=MON[i],boss=i===9;
  let p=50*Math.pow(1.15,f-1);if(boss)p*=1.25;
  const tier=TIERS[Math.min(t,4)]+(t>4?' '+(t-3):'');

}
function effPower(m,pw){
  const L=lvl(pw.T.s[m.w],needStat).l,bonus=0.04*(L-1),eq=ivEq(m),el=ivEl();
  return {p:Math.round(pw.total*(1+bonus+eq+el)),bonus:Math.round(bonus*100),L,eq:Math.round(eq*100),el:Math.round(el*100)};

function checkArise(){
  const sh=shadows(),seen=S.army.seen,nw=sh.filter(x=>!seen.includes(x.id));

function fight(){
  if(ui.battle&&!ui.battle.done)return;

  S.army.log.push({f:m.f,win,d:dayKey(),p:e.p,mp:m.p});
  if(S.army.log.length>30)S.army.log=S.army.log.slice(-30);

  const drops=win?ivLoot(m.f,m.boss,m.w):[];S.inv.el=0;
  save();
  const names=pw.list.slice(0,6).map(x=>x.name);
  ui.battle={m,drops,P:e.p,win,fP,fM,cP:100,cM:100,line:'بدأ القتال',done:false,names,need:m.p-e.p,adv:win?'':advice(m,pw,m.p-e.p)};
  render();
  const rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const R=rm?1:5;let k=0;

    b.line=k===R?(b.win?'الضربة القاضية من '+who:'الوحش أقوى منك المرة دي'):(k%2?'هجوم من '+who:'الوحش بيرد الهجوم');

const hasQ=eid=>eid==='e1'||eid==='e2';
function qUnit(eid,u){
  if(!hasQ(eid))return null;
  const m=/^se([12])_(\d+)$/.exec(u.id);if(!m||m[1]!==eid.slice(1))return null;
  const k=(m[1]==='2'?100:0)+(+m[2]);return {k,e:QE[k]||[],m:QM[k]||[]};
}
function qReq(qu){return qu.e.length?{e:2,m:2}:{e:0,m:3};}
function qProg(uid){const d=S.qd[uid];return d&&Array.isArray(d.e)&&Array.isArray(d.m)?d:{e:[],m:[]};}
function qMet(eid,u){
  const qu=qUnit(eid,u);if(!qu||(!qu.e.length&&!qu.m.length))return true;
  const r=qReq(qu),d=qProg(u.id);return d.e.length>=r.e&&d.m.length>=r.m;
}
function unitMeta(eid,u,done){
  let h=u.p?'<i>ص '+N(u.s)+' · '+N(u.p)+' صفحة</i>':'';

/* ---------- PvP: friends exchange "hunter cards" (codes). Duels compare this week's real effort per stat. ---------- */
const CARD_SALT='hunter-pvp-1';
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h.toString(16);}
function b64e(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64d(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';return decodeURIComponent(escape(atob(str)));}
function weekXp(){
  const since=dayKey(daysAgo(6)),w=STATS.map(()=>0);let W=0;
  S.entries.forEach(e=>{if(e.day>=since&&e.xp>0){W+=e.xp;const i=STATS.findIndex(x=>x.id===e.stat);if(i>=0)w[i]+=e.xp;}});
  return {w,W};
}
function myCard(){
  const T=totals(),A=lvl(T.xp,needAll),pw=power(),wk=weekXp();
  return {v:1,id:S.pvp.me,n:S.name,t:Date.now(),L:A.l,R:rankOf(A.l),P:pw.total,s:STATS.map(x=>lvl(T.s[x.id],needStat).l),w:wk.w,W:wk.W,k:streakNow(),a:pw.n,f:S.army.best||0,elo:S.pvp.elo};
}
function encodeCard(c){const j=JSON.stringify(c);return 'HNT1.'+b64e(j)+'.'+fnv(CARD_SALT+j);}
function decodeCard(txt){
  const m=/HNT1\.([A-Za-z0-9_-]+)\.([0-9a-f]+)/.exec(txt||'');
  if(!m)return {err:'مش لاقي كود كارت في النص ده. انسخ الرسالة كلها من صاحبك.'};
  let j,c;
  try{j=b64d(m[1]);c=JSON.parse(j);}catch(e){return {err:'الكود ناقص أو متلخبط. اطلب من صاحبك يبعته تاني.'};}
  if(fnv(CARD_SALT+j)!==m[2])return {err:'الكود اتعدّل بعد ما اتعمل، فمش هينفع يتضاف.'};
  const v=validCard(c);if(!v)return {err:'الكود مش بتاع نظام الصياد.'};
  if(v.t>Date.now()+864e5)return {err:'تاريخ الكارت في المستقبل، فمش هينفع يتضاف.'};
  return {card:v};
}
function validCard(c){
  const num=(x,max)=>typeof x==='number'&&isFinite(x)&&x>=0&&x<=max;
  const arr=(a,max)=>Array.isArray(a)&&a.length===5&&a.every(x=>num(x,max));
  if(!c||typeof c!=='object'||c.v!==1||typeof c.id!=='string'||c.id.length>20||typeof c.n!=='string'||!num(c.t,4e12)||!num(c.L,999)||!num(c.P,1e7)||!arr(c.s,999)||!arr(c.w,1e5)||!num(c.W,1e6)||!num(c.k,9999)||!num(c.a,999)||!num(c.f,9999))
    return null;
  return {v:1,id:c.id,n:c.n.slice(0,20)||'صياد',t:c.t,L:c.L,R:['E','D','C','B','A','S'].includes(c.R)?c.R:rankOf(c.L),P:c.P,s:c.s.slice(),w:c.w.slice(),W:c.W,k:c.k,a:c.a,f:c.f,elo:num(c.elo,4000)&&c.elo>=100?c.elo:1000};
}
function cardAge(c){return Math.floor((Date.now()-c.t)/864e5);}
function ageText(c){const d=cardAge(c);return d<=0?'الكارت من النهارده':d===1?'الكارت من امبارح':'الكارت من '+d+' أيام';}
function addFriend(){
  const r=decodeCard(ui.pvpPaste);

function duelResult(me,fr){
  const rounds=STATS.map((st,i)=>{
    let a=me.w[i],b=fr.w[i],by='w';
    if(a===0&&b===0){a=me.s[i];b=fr.s[i];by='s';}
    return {st,a,b,by,win:a>b?1:a<b?-1:0};
  });
  const my=rounds.filter(r=>r.win>0).length,th=rounds.filter(r=>r.win<0).length;
  let res=my>th?1:my<th?-1:0,tb='';
  if(!res){res=me.W>fr.W?1:me.W<fr.W?-1:0;tb='w';}
  if(!res){res=me.P>fr.P?1:me.P<fr.P?-1:0;tb='p';}
  return {rounds,my,th,res,tb};

  for(let j=it.length-1;j>0;j--){const k=Math.floor(R()*(j+1));[it[j],it[k]]=[it[k],it[j]];}

/* ---------- network: one ranking from cards (codes), the owner's hub and online players ----------
   The owner relays cards into hub/cards (owner-write). Any signed-in viewer who can open the page can read it. */
live.hub={};live.isOwner=false;live.hubState='none';
let hubT=null,hubLast='';
function hubInit(){
  try{
    live.hubState='loading';
    ctx.db.doc('hub/cards').onSnapshot(sn=>{
      const d=sn.exists?sn.data():null;
      live.hub=d&&d.cards&&typeof d.cards==='object'?d.cards:{};live.hubState='ok';rerenderOnline();
    },()=>{live.hubState='err';rerenderOnline();});
  }catch(e){live.hubState='err';}
}
function schedHub(){if(!live.isOwner||!ctx.db)return;clearTimeout(hubT);hubT=setTimeout(pushHub,1500);}
async function pushHub(){
  if(!live.isOwner||!ctx.db)return;
  const cards={};
  Object.keys(live.hub).forEach(k=>{const v=validCard(live.hub[k]);if(v)cards[k]=v;});
  Object.keys(S.pvp.friends).forEach(k=>{const c=S.pvp.friends[k].card;if(!cards[k]||cards[k].t<c.t)cards[k]=c;});
  (S.pvp.hubDel||[]).forEach(k=>{if(!S.pvp.friends[k])delete cards[k];});
  const me=myCard();cards[me.id]=me;
  const out={};Object.keys(cards).sort((a,b)=>cards[b].t-cards[a].t).slice(0,100).forEach(k=>out[k]=cards[k]);
  const cmp=JSON.stringify(Object.assign({},out,{[me.id]:Object.assign({},me,{t:0})}));
  if(cmp===hubLast)return;
  try{await ctx.db.doc('hub/cards').set({cards:out});hubLast=cmp;}catch(e){}
}
function cardFromLeague(x){
  if(!x||typeof x!=='object')return null;
  return validCard({v:1,id:x.pid,n:x.n,t:x.t,L:x.L,R:x.R,P:x.P,s:x.s,w:x.w,W:x.W,k:x.k,a:x.a,f:x.f,elo:x.elo});
}
function network(){
  const M={};
  const put=(c,src,extra)=>{
    if(!c||!c.id||c.id===S.pvp.me)return;
    const x=M[c.id];
    if(!x)M[c.id]={card:c,src:[src]};
    else{if(c.t>x.card.t)x.card=c;if(!x.src.includes(src))x.src.push(src);}
    if(extra)Object.assign(M[c.id],extra);
  };
  Object.keys(live.hub).forEach(k=>put(validCard(live.hub[k]),'hub'));
  Object.keys(S.pvp.friends).forEach(k=>put(S.pvp.friends[k].card,'code'));
  Object.keys(live.league).forEach(k=>{if(k!==ctx.uid)put(cardFromLeague(live.league[k]),'online',{lid:k,ev:Array.isArray(live.league[k].ev)?live.league[k].ev.slice(0,5):[],dw:nz(live.league[k].dw,1e5),dl:nz(live.league[k].dl,1e5)});});
  others().forEach(p=>{const pid=p.presence.pid;if(typeof pid==='string'&&M[pid])M[pid].peer=p.peer;});
  return M;
}

/* ---------- gym: animated hunter figure (side view, forward kinematics + 2-bone IK) ---------- */
const GF=168,AY=164,GL={th:38,sh:38,to:44,ua:30,fa:28};
const gD=Math.PI/180,gdir=a=>[Math.sin(a*gD),Math.cos(a*gD)];
const gl=(a,b,t)=>a+(b-a)*t;
function gik(p0,p1,l1,l2,pref){
  const dx=p1[0]-p0[0],dy=p1[1]-p0[1],d=Math.hypot(dx,dy)||1e-3;
  const dd=Math.min(l1+l2-.01,Math.max(Math.abs(l1-l2)+.01,d)),ux=dx/d,uy=dy/d;
  const a=(l1*l1-l2*l2+dd*dd)/(2*dd),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  let px=-uy,py=ux;if(px*pref[0]+py*pref[1]<0){px=-px;py=-py;}
  return {j:[p0[0]+ux*a+px*h,p0[1]+uy*a+py*h],e:[p0[0]+ux*dd,p0[1]+uy*dd]};
}
const gv=(A,B,k,t)=>{const a=A[k],b=B[k];if(a==null||b==null)return a==null?b:a;return Array.isArray(a)?[gl(a[0],b[0],t),gl(a[1],b[1],t)]:gl(a,b,t);};
function gJ(d,t){
  const A=d.p[0],B=d.p[1],g=k=>gv(A,B,k,t);
  const hip=g('hip'),ta=g('ta'),sho=[hip[0]+GL.to*Math.sin(ta*gD),hip[1]+GL.to*Math.cos(ta*gD)];
  const lgA=A.lg!=null?g('lg'):null,ankT=lgA!=null?[hip[0]+(GL.th+GL.sh-1)*Math.sin(lgA*gD),hip[1]+(GL.th+GL.sh-1)*Math.cos(lgA*gD)]:g('ank');
  const L1=gik(hip,ankT,GL.th,GL.sh,g('kp')||[1,0]);
  const o={hip,sho,knee:L1.j,ank:L1.e,toe:A.tp?g('tp'):[L1.e[0]+10,L1.e[1]+4]};
  if(A.a2){const L2=gik(hip,g('a2'),GL.th,GL.sh,g('kp2')||[1,0]);o.knee2=L2.j;o.ank2=L2.e;o.toe2=[L2.e[0]+10,L2.e[1]+4];}
  const td=gdir(ta);o.head=[sho[0]+td[0]*17,sho[1]+td[1]*17];
  if(A.elb){const e=g('elb'),fa=g('fa'),fd=gdir(fa);o.elb=[sho[0]+e[0],sho[1]+e[1]];o.hand=[o.elb[0]+GL.fa*fd[0],o.elb[1]+GL.fa*fd[1]];}
  else{const tg=A.habs?g('habs'):(()=>{const h=g('hand');return [sho[0]+h[0],sho[1]+h[1]];})();if(A.arc){tg[0]+=A.arc[0]*Math.sin(Math.PI*t);tg[1]+=A.arc[1]*Math.sin(Math.PI*t);}
    const L3=gik(sho,tg,GL.ua,GL.fa,g('ep')||[0,1]);o.elb=L3.j;o.hand=L3.e;}
  return o;
}
const gm=(a,b,k)=>[gl(a[0],b[0],k),gl(a[1],b[1],k)];
function gMu(J,k){
  switch(k){
    case 'sho':return J.sho;case 'hip':return J.hip;case 'knee':return J.knee;case 'elb':return J.elb;
    case 'quad':case 'ham':return gm(J.hip,J.knee,.5);
    case 'calf':return gm(J.knee,J.ank,.5);
    case 'arm':return gm(J.sho,J.elb,.5);
    case 'fore':return gm(J.elb,J.hand,.5);
    case 'back':return gm(J.hip,J.sho,.5);
    case 'chest':{const p=gm(J.hip,J.sho,.85);return [p[0],p[1]-5];}
    case 'core':return gm(J.hip,J.sho,.35);
  }return J.hip;
}
const gpl=(x,y,r)=>'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r+'" fill="#1b1405" stroke="#f5c451" stroke-width="2.2"/><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(r*.35)+'" fill="#f5c451"/>';
const gln=(a,b,c,w,o)=>'<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round"'+(o?' opacity="'+o+'"':'')+'/>';
function gbone(pts,c,w){
  w=w||5.4;const s=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return '<polyline points="'+s+'" fill="none" stroke="'+c+'" stroke-opacity=".16" stroke-width="'+(w+10.6)+'" stroke-linecap="round" stroke-linejoin="round"/>'
   +'<polyline points="'+s+'" fill="none" stroke="'+c+'" stroke-width="'+(w+3.6)+'" stroke-linecap="round" stroke-linejoin="round"/>'
   +'<polyline points="'+s+'" fill="none" stroke="#0a1a38" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>';
}
/* returns svg markup for one frame; k = muscle glow strength 0..1 */
function gFrame(d,t,k,bad){
  const J=gJ(d,t),c=bad?'#ff6b82':'#5ec2ff';let s='';
  if(J.knee2)s+='<g opacity=".55">'+gbone([J.hip,J.knee2,J.ank2,J.toe2],c,6)+'</g>';
  d.mu.forEach(m=>{const p=gMu(J,m[1]);s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(11+4*k).toFixed(1)+'" fill="#ff5d73" opacity="'+(.18+.5*k).toFixed(2)+'"/>';});
  s+=gbone([J.hip,J.knee,J.ank,J.toe],c,6)+gbone([J.hip,J.sho],c,8.6);
  s+=gbone([J.sho,J.elb,J.hand],c,4.8);
  s+='<circle cx="'+J.head[0].toFixed(1)+'" cy="'+J.head[1].toFixed(1)+'" r="9.5" fill="#0a1a38" stroke="'+c+'" stroke-width="2"/>';
  const hd=gdir(d.p[0].ta);s+=gln([J.head[0]+3,J.head[1]-1],[J.head[0]+8,J.head[1]-1],c,2.4);
  if(d.eq)s+=d.eq(J,t);
  return s;
}

function gyFinish(){

  if(g.doneDay===day){toast('خلصت تمرين النهارده');return;}
  const sets=gyToday();let plan=0,done=0;
  ses.e.forEach(e=>{plan+=e[1];done+=Math.min(e[1],sets.filter(s=>s.ex===e[0]).length);});
  const need=Math.ceil(plan*.7);
  if(done<need){toast('محتاج '+need+' مجموعات من خطة اليوم على الأقل، عملت '+done);return;}
  const before=snap();g.doneDay=day;g.sess++;
  S.entries.push({id:uid(),day,ts:Date.now(),kind:'gym',stat:'body',xp:30,gold:15,fin:1,label:'أنهيت تمرين: '+ses.n});
  queue.push({k:'[ إشعار النظام ]',t:'انتهى التمرين',b:'+30',s:'أنهيت '+ses.n+' · '+done+' من '+plan+' مجموعة'});

}

    e.cats=e.cats.filter(c=>['a','p','u'].includes(c));if(!e.cats.length)e.cats=['a','p'];

  });
}
const lnE=()=>S.ln[ui.ln.lang];
function lnAll(){
  const k=ui.ln.lang;
  if(!LALL[k])LALL[k]=(LBANK[k]||[]).map((r,i)=>({id:'b'+i,c:r[0],w:r[1],ar:r[2],ex:r[3]}));

const lnById=id=>lnAll().find(w=>w.id===id);

function lnDue(){const t=dayKey(),e=lnE();return lnAll().filter(w=>e.box[w.id]>=1&&(e.due[w.id]||t)<=t);}

const lnRankIdx=m=>{let i=0;LRANK.forEach(t=>{if(m>=t)i++;});return i;};

function lnStats(){const e=S.ln&&S.ln.en;if(!e)return {m:0,c:0};const k=ui.ln.lang;ui.ln.lang='en';const r={m:lnMast(),c:lnWeek()};ui.ln.lang=k;return r;}

const lnShuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ----- question builders ----- */
function lnOpts(w,key){
  const same=lnAll().filter(x=>x.id!==w.id&&(w.c==='u'||x.c===w.c)&&x[key]!==w[key]);
  const all=lnAll().filter(x=>x.id!==w.id&&x[key]!==w[key]);
  const pick=lnShuf(same).slice(0,3);
  if(pick.length<3)lnShuf(all).forEach(x=>{if(pick.length<3&&!pick.some(p=>p[key]===x[key]))pick.push(x);});
  const opts=lnShuf([w].concat(pick)).map(x=>x[key]);
  return {opts,ans:opts.indexOf(w[key])};
}
function lnClozeText(w){
  if(!w.ex||w.c==='r')return null;
  const re=new RegExp('\\b'+w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*','i');
  return re.test(w.ex)?w.ex.replace(re,'_____'):null;

function lnPrep(it){
  const w=lnById(it.id);if(!w){it.skip=true;return;}
  const b=lnBox(it.id);let k;
  if(it.t==='dict'||it.t==='ord')k=it.t;
  else if(it.t==='new'||b<=1)k='en2ar';
  else if(b===2)k='ar2en';
  else if(b===3)k=lnClozeText(w)?'cloze':'ar2en';
  else k=(w.c==='c'||w.c==='r')?'ar2en':'type';
  const c={k};
  if(k==='en2ar'){Object.assign(c,lnOpts(w,'ar'));}
  else if(k==='ar2en'){Object.assign(c,lnOpts(w,'w'));}
  else if(k==='cloze'){Object.assign(c,lnOpts(w,'w'));c.txt=lnClozeText(w);}
  else if(k==='ord'){const ref=lnSent(w).split(' ');let s=lnShuf(ref.map((t,i)=>i));if(ref.length>1&&s.every((v,i)=>ref[v]===ref[i]))s=s.reverse();c.ref=ref;c.bag=s;c.ans=[];}

/* ----- session ----- */
function lnModeName(m){return m==='srs'?'مراجعة الكلمات':m==='dict'?'اسمع واكتب':'رتّب الجملة';}
function lnStart(mode){
  const e=lnE(),t=dayKey();

  let q=[];
  if(mode==='srs'){
    const due=lnDue().sort((a,b)=>(e.due[a.id]||'')<(e.due[b.id]||'')?-1:1).slice(0,20);
    const left=Math.max(0,e.quota-e.newd.n);
    const nw=lnPool().sort((a,b)=>(b.c==='u')-(a.c==='u')).slice(0,left);
    q=nw.map(w=>({id:w.id,t:'new',stage:'info'})).concat(due.map(w=>({id:w.id,t:'rev',stage:'test'})));
    if(!q.length){toast('مفيش كلمات مستحقة ولا جديدة النهارده. ارجع بكرة أو زوّد الكلمات الجديدة من الإعدادات');return;}
  }else{

function lnLCS(a,b){
  const n=a.length,m=b.length,D=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=a[i-1]===b[j-1]?D[i-1][j-1]+1:Math.max(D[i-1][j],D[i][j-1]);

      Q.fb=Object.assign({ok},extra);lnGrade(it,ok);render();}break;
    case 'lnnext':lnNext();break;
    case 'lnbag':if(Q&&!Q.fb){const c=Q.q[Q.i].cur;if(!c.ans.includes(parseInt(v,10)))c.ans.push(parseInt(v,10));render();}break;
    case 'lnunbag':if(Q&&!Q.fb){const c=Q.q[Q.i].cur;c.ans.splice(parseInt(v,10),1);render();}break;
    case 'lnadd':{
      const w=(ui.ln.mw||'').trim(),ar=(ui.ln.ma||'').trim(),ex=(ui.ln.me||'').trim();
      if(!/^[A-Za-z][A-Za-z '\-]{0,39}$/.test(w)){toast('اكتب الكلمة بالإنجليزي (حروف فقط)');return;}

    case 'lndel':{const e=lnE();e.mine=e.mine.filter(m=>'u'+m.id!==id);delete e.box[id];delete e.due[id];save();render();break;}
  }

function rdInit(){
  if(!S.rd||typeof S.rd!=='object')S.rd={};

  if(!r.st||typeof r.st!=='object')r.st={};
  if(!r.cur||typeof r.cur!=='object')r.cur={};
  if(!r.xd||typeof r.xd!=='object')r.xd={d:'',x:0};
  if(!Array.isArray(r.bk))r.bk=[];
  if(!(r.goal>0))r.goal=12;
  ['rx','qd','cd'].forEach(k=>{if(!r[k]||typeof r[k]!=='object')r[k]={d:'',x:0,n:0};});
  if(!r.sess||typeof r.sess!=='object')r.sess=null;

function rdChoose(i){

function rdEnd(s,nid){

    const before=snap();S.rd.xd.x+=xp;
    S.entries.push({id:uid(),day:t,ts:Date.now(),kind:'story',stat:s.s,xp,gold:Math.round(xp/2),label:'قصة: '+s.t+' · '+s.n[nid].e[1]});

function rdBack(){

const RCAP=80,RCMAX=3;
const rbH=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h;};
const rbB=id=>S.rd.bk.find(b=>b.id===id);
const rbNeed=c=>Math.max(1,Math.ceil(c.p/3));

const rbWords=t=>String(t).trim().split(/\s+/).filter(Boolean).length;

const rbNorm=s=>String(s).toLowerCase().replace(/[ً-ٰٟ]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}]/gu,'');
function rbLev(a,b){const m=a.length,n=b.length,D=[];for(let i=0;i<=m;i++){D[i]=[i];}for(let j=1;j<=n;j++)D[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return D[m][n];}
function rbSame(a,b){const x=rbNorm(a),y=rbNorm(b);return !!x&&(x===y||(y.length>=6&&rbLev(x,y)<=1));}
function rbCloze(text){

  if(!cand.length)return null;
  const k=cand[Math.floor(Math.random()*cand.length)],lo=Math.max(0,k.i-6),hi=Math.min(toks.length,k.i+7),w=toks.slice(lo,hi);

function rbFinish(){

/* ---------- loot: items that drop from tower monsters, inventory, equipment ---------- */
const RAR=[{n:'عادي',c:'#9aa6b8'},{n:'نادر',c:'#5ec2ff'},{n:'ملحمي',c:'#b57bff'},{n:'أسطوري',c:'#f5c451'},{n:'خرافي',c:'#ff5d73'}];
const RPRE=['','مصقول','ملحمي','أسطوري','خرافي'];
const IK={
  w:{n:'سلاح',v:['نصل','خنجر','فأس','رمح','قوس'],p:[3,6,10,16,25]},
  a:{n:'درع',v:['درع','خوذة','قفازات','حذاء','عباءة'],p:[2,4,7,12,18]},
  c:{n:'تميمة',v:['تميمة','خاتم','قلادة','ميدالية','عين'],p:[1,2,4,7,12],t:[5,10,20,35,60]},
  e:{n:'إكسير',p:[10,20,30,45,70]},
  t:{n:'ساعة التاجر',m:[1.5,2,3,5,10],d:[15,20,30,45,60]},
  b:{n:'صندوق التاجر',min:[5,20,60,240,1000],fl:[200,2000,2e4,2e5,2e6]}
};
const IV_CAP=60;
function invInit(){
  if(!S.inv||typeof S.inv!=='object')S.inv={};
  const I=S.inv;
  if(!Array.isArray(I.it))I.it=[];
  I.it=I.it.filter(x=>x&&typeof x==='object'&&typeof x.id==='string'&&['w','a','c','e','t','b'].includes(x.k)&&x.r>=0&&x.r<=4);
  if(!I.eq||typeof I.eq!=='object')I.eq={w:'',a:'',c:''};
  ['w','a','c'].forEach(k=>{if(typeof I.eq[k]!=='string')I.eq[k]='';});
  if(!(I.el>=0))I.el=0;
  if(!I.tb||typeof I.tb!=='object')I.tb={u:0,m:1};
  ['got','paid'].forEach(k=>{if(!I[k]||typeof I[k]!=='object')I[k]={};});
  ['sold','bought','found'].forEach(k=>{if(!(I[k]>=0))I[k]=0;});
}
function itemName(it){
  const r=RPRE[it.r]?' '+RPRE[it.r]:'';
  if(it.k==='e')return 'إكسير القوة'+r;
  if(it.k==='t')return 'ساعة التاجر'+r;
  if(it.k==='b')return 'صندوق التاجر'+r;
  const st=SMAP[it.s]?SMAP[it.s].name:'';
  return IK[it.k].v[(it.v||0)%5]+' '+st+r;
}
function itemDesc(it){
  const d=IK[it.k],r=it.r;
  if(it.k==='w'||it.k==='a')return '+'+d.p[r]+'% قوة في البرج (×1.5 قدام وحوش '+(SMAP[it.s]?SMAP[it.s].name:'')+')';
  if(it.k==='c')return '+'+d.p[r]+'% قوة و +'+d.t[r]+'% دخل التاجر وهي لابساها';
  if(it.k==='e')return 'تقوّيك +'+d.p[r]+'% في القتال الجاي بس';
  if(it.k==='t')return 'دخل التاجر ×'+d.m[r]+' لمدة '+d.d[r]+' دقيقة';
  return 'فلوس = دخل التاجر لمدة '+d.min[r]+' دقيقة';
}
function ivNpc(it){
  const r=it.r,inc=Math.max(0,tcInc(Date.now()));
  return Math.max([30,300,3000,3e4,3e5][r],Math.round(inc*60*[1,4,15,60,240][r]));
}
function ivFind(id){return S.inv.it.find(x=>x.id===id);}
function ivWorn(id){const e=S.inv.eq;return e.w===id||e.a===id||e.c===id;}
function ivEq(m){
  let s=0;const I=S.inv;
  ['w','a','c'].forEach(k=>{const it=ivFind(I.eq[k]);if(!it)return;s+=IK[k].p[it.r]/100*((m&&it.s===m.w)?1.5:1);});
  return s;
}
function ivEl(){return S.inv.el>0?S.inv.el:0;}
function ivTcMul(now){
  const I=S.inv;let m=1;
  const c=ivFind(I.eq.c);if(c)m+=IK.c.t[c.r]/100;
  if(I.tb.u>now)m*=I.tb.m;
  return m;
}
function ivAdd(it){
  const I=S.inv;
  if(I.it.length>=IV_CAP){S.tc.cash+=ivNpc(it);return false;}
  I.it.push(it);return true;
}
function ivRoll(f,boss,gate){
  const t=Math.min(8,Math.floor((f-1)/10)),u=Math.random();
  let r=0;
  if(gate){r=u<.03?2:u<.2?1:0;}
  else{
    const p4=boss?.01+.004*t:.002+.0008*t,p3=boss?.06+.01*t:.015+.004*t,p2=boss?.22:.08+.01*t,p1=boss?.6:.35+.02*t;
    r=u<p4?4:u<p4+p3?3:u<p4+p3+p2?2:u<p4+p3+p2+p1?1:0;
  }
  const w=Math.random();
  const k=w<.26?'w':w<.48?'a':w<.62?'c':w<.78?'e':w<.9?'t':'b';
  return {k,r};
}
function ivMake(f,boss,stat,gate){
  const x=ivRoll(f,boss,gate);
  return {id:uid(),k:x.k,r:x.r,s:stat,v:Math.floor(Math.random()*5),f:gate?0:f};
}
function ivLoot(f,boss,stat){
  const out=[];
  if(Math.random()<(boss?1:.55))out.push(ivMake(f,boss,stat,false));
  if(boss&&Math.random()<.5)out.push(ivMake(f,true,stat,false));
  out.forEach(it=>{ivAdd(it);S.inv.found++;});
  return out;
}
function ivGate(stat,mins){
  if(Math.random()>=Math.min(.6,.15+mins/150))return;
  const it=ivMake(1,false,stat,true);ivAdd(it);S.inv.found++;save();
  queue.push({k:'[ غنيمة ]',t:'غنيمة من البوابة',b:itemName(it),s:RAR[it.r].n+' · '+itemDesc(it)});
}
function ivClick(a,id,v){
  const I=S.inv,now=Date.now(),it=ivFind(id);
  switch(a){
    case 'ivgo':ui.tab='gym';ui.field='money';ui.mn='game';ui.tcs='inv';render();window.scrollTo(0,0);return;
    case 'ivun':I.eq[id]='';save();render();return;
    case 'ivuse':{
      if(!it)return;
      if(it.k==='w'||it.k==='a'||it.k==='c'){I.eq[it.k]=it.id;save();render();toast('لبست '+esc(itemName(it)));return;}
      if(it.k==='e'){if(I.el>0){toast('عندك إكسير شغال للقتال الجاي');return;}I.el=IK.e.p[it.r]/100;}
      else if(it.k==='t'){if(I.tb.u>now){toast('ساعة التاجر شغالة بالفعل');return;}I.tb={u:now+IK.t.d[it.r]*60000,m:IK.t.m[it.r]};}
      else if(it.k==='b'){const g=Math.max(IK.b.fl[it.r],Math.round(tcInc(now)*60*IK.b.min[it.r]));S.tc.cash+=g;S.tc.life+=g;toast('الصندوق فيه <span class="g">+'+N(tcF(g))+'</span>');}
      I.it=I.it.filter(x=>x.id!==id);save();render();
      if(it.k!=='b')toast('اتفعّل: '+esc(itemName(it)));
      return;
    }
    case 'ivnpc':{
      if(!it||ivWorn(id)){toast('الغرض لابسه. اقلعه الأول');return;}
      if(it.r>=2&&ui.ivc!==id){ui.ivc=id;toast('اضغط تاني لتأكيد البيع للتاجر');render();return;}
      const g=ivNpc(it);S.tc.cash+=g;S.tc.life+=g;I.it=I.it.filter(x=>x.id!==id);ui.ivc=null;save();render();
      toast('اتباع بـ <span class="g">'+N(tcF(g))+'</span>');return;
    }
    case 'ivmerge':{
      const [k,rs]=String(id).split(':'),r=parseInt(rs,10);
      const pool=I.it.filter(x=>x.k===k&&x.r===r&&!ivWorn(x.id));
      if(pool.length<3||!(r>=0&&r<4))break;
      const cost=ivNpc(pool[0])*2;if(S.tc.cash<cost){toast('رصيدك مش كفاية');break;}
      const pick=pool.slice(0,3),ids=pick.map(x=>x.id);
      S.tc.cash-=cost;I.it=I.it.filter(x=>!ids.includes(x.id));
      const n={id:uid(),k,r:r+1,s:pick[Math.floor(Math.random()*3)].s,v:Math.floor(Math.random()*5),f:Math.max(...pick.map(x=>x.f||0))};
      I.it.push(n);save();render();
      queue.push({k:'[ ورشة ]',t:'اندمجت 3 أغراض',b:itemName(n),s:RAR[n.r].n+' · '+itemDesc(n)});showNext();return;}
    case 'ivlist':{
      if(!it||ivWorn(id)){toast('الغرض لابسه. اقلعه الأول');return;}
      ui.xm.sell=id;ui.xm.price='';ui.tcs='mk';render();window.scrollTo(0,0);return;
    }
  }
}

const TCD=[{id:'d1',n:'شهادة 10 دقايق',m:10,r:.03},{id:'d2',n:'شهادة ساعة',m:60,r:.2},{id:'d3',n:'شهادة 4 ساعات',m:240,r:.9}];
function tcInit(){
  if(!S.tc||typeof S.tc!=='object')S.tc={};
  const t=S.tc;
  if(!(t.cash>=0))t.cash=20;
  if(!(t.tot>=0))t.tot=0;
  if(!(t.t>0))t.t=Date.now();
  if(!t.n||typeof t.n!=='object')t.n={};
  if(!t.up||typeof t.up!=='object')t.up={};
  if(!t.sh||typeof t.sh!=='object')t.sh={};
  if(!t.pr||typeof t.pr!=='object')t.pr={n:0};
  if(!t.pr.sp||typeof t.pr.sp!=='object')t.pr.sp={};
  if(!Array.isArray(t.bd))t.bd=[];
  if(!t.bn||typeof t.bn!=='object')t.bn={d:'',until:0};
  if(!t.mg||typeof t.mg!=='object')t.mg={};
  if(typeof t.mgOn!=='boolean')t.mgOn=true;
  if(!(t.life>=0))t.life=t.tot||0;
  if(!t.cd||typeof t.cd!=='object')t.cd={d:'',earn:0,buy:{},sh:0,cl:{}};
  if(!t.dc||typeof t.dc!=='object')t.dc={s:-1};
  if(!t.vo||typeof t.vo!=='object')t.vo={s:-1,d:{}};
  if(!t.vo.d||typeof t.vo.d!=='object')t.vo.d={};
  if(!t.bx||typeof t.bx!=='object')t.bx={u:0,m:1};
  if(!(t.dn>=0))t.dn=0;
}
function tcF(n){n=Math.floor(n);if(n<1000)return String(n);const u=['K','M','B','T','Qa','Qi'];let i=-1,v=n;while(v>=1000&&i<u.length-1){v/=1000;i++;}return v.toFixed(v<10?2:v<100?1:0)+u[i];}
const tcF2=n=>n<10?n.toFixed(1):tcF(n);
function tcEv(now){const b=Math.floor(now/600000),e=TCE[rbH('e'+b)%TCE.length];return (now-b*600000<300000)?{e,until:b*600000+300000}:null;}
const tcSp=()=>TCP.reduce((a,p)=>a+(S.tc.pr.sp[p.id]?p.c:0),0);
const tcMc=b=>b.c*60*(S.tc.pr.sp.p2?.5:1),tcUc=u=>u.c*(S.tc.pr.sp.p3?.7:1);
function tcMult(id,now){
  const t=S.tc;let m=1+.1*(t.pr.n-tcSp());
  TCU.forEach(u=>{if(t.up[u.id]&&(u.t==='all'||u.t===id))m*=u.m;});
  const nn=t.n[id]||0;TCMS.forEach(x=>{if(nn>=x)m*=2;});m*=1+.05*TCA.filter(x=>t.life>=x).length;
  const ev=tcEv(now);if(ev&&(ev.e[1]==='all'||ev.e[1]===id))m*=ev.e[2];
  if(now<t.bn.until)m*=2;
  return m;
}
function tcInc(now){let s=0;TCB.forEach(b=>{const n=S.tc.n[b.id]||0;if(n)s+=n*b.i*tcMult(b.id,now);});return s*ivTcMul(now)*((S.tc.bx&&S.tc.bx.u>now)?S.tc.bx.m:1);}
const tcCostK=(b,have,k)=>b.c*Math.pow(1.15,have)*(Math.pow(1.15,k)-1)/.15;
function tcMax(b,have,cash){let k=0;while(k<2000&&tcCostK(b,have,k+1)<=cash)k++;return k;}
function tcTick(){
  const t=S.tc,now=Date.now(),dt=Math.max(0,Math.min((now-t.t)/1000,8*3600));
  const g=tcInc(now)*dt;t.t=now;t.cash+=g;t.tot+=g;t.life+=g;tcDay();t.cd.earn+=g;
  if(dt>0){let dv=0;TCS.forEach(x=>{const h=t.sh[x.id]||0;if(h)dv+=h*tcPrice(x,now)*(x.y==null?.0001:x.y)*dt;});if(dv>0){t.cash+=dv;t.life+=dv;t.cd.earn+=dv;}}
  if(t.mgOn)TCB.forEach(b=>{if(t.mg[b.id]){for(let k=0;k<5;k++){const have=t.n[b.id]||0,c=tcCostK(b,have,1);if(t.cash>=c){t.cash-=c;t.n[b.id]=have+1;t.cd.buy[b.id]=(t.cd.buy[b.id]||0)+1;}else break;}}});
  if(dt>120&&g>0&&!ui.tcAwaySeen){ui.tcAway={m:Math.round(dt/60),g};}
  ui.tcAwaySeen=true;return g;
}
function tcDay(){const t=S.tc,dk=dayKey();if(t.cd.d!==dk)t.cd={d:dk,earn:0,buy:{},sh:0,cl:{}};}
function tcCon(){
  tcDay();const t=S.tc,dk=dayKey(),inc=Math.max(1,tcInc(Date.now()));let mx=0;TCB.forEach((b,i)=>{if((t.n[b.id]||0)>0)mx=i;});
  const b=TCB[Math.min(TCB.length-1,rbH(dk+'a')%(mx+2))],nb=3+rbH(dk+'b')%6,te=Math.max(500,Math.round(inc*1800*(1+rbH(dk+'c')%3)));
  return [{i:0,txt:'اشتري '+nb+' من «'+b.n+'»',need:nb,have:t.cd.buy[b.id]||0,rew:Math.max(100,inc*900)*(t.pr.sp.p4?2:1)},{i:1,txt:'اكسب '+tcF(te)+' النهارده',need:te,have:t.cd.earn,rew:Math.max(150,inc*1500)*(t.pr.sp.p4?2:1)},{i:2,txt:'اشتري 3 أسهم في البورصة',need:3,have:t.cd.sh,rew:Math.max(80,inc*600)*(t.pr.sp.p4?2:1)}];
}
function tcPrice(s,now){const m=now/60000,a=s.a||1;return Math.max(s.b*(a>1?.2:.45),s.b*(1+.35*a*Math.sin(m/s.p1+s.f)+.2*a*Math.sin(m/s.p2+s.f*2)));}
function tcNet(now){let v=S.tc.cash;S.tc.bd.forEach(x=>{v+=x.amt;});TCS.forEach(s=>{v+=(S.tc.sh[s.id]||0)*tcPrice(s,now);});return v;}
function tcStats(){if(!S.tc)return {p:0,w:0};return {p:S.tc.pr.n,w:Math.round(Math.log10(tcNet(Date.now())+10)*10)/10};}
function tcBonusReady(){return S.tc.bn.d!==dayKey()&&S.ledger.some(x=>x.day===dayKey());}
function tcClick(a,id,v){
  const t=S.tc,now=Date.now();tcTick();
  switch(a){
    case 'tcsub':ui.mn=v;render();break;
    case 'tcseg':ui.tcs=v;ui.xm.conf=null;ui.ivc=null;render();break;
    case 'tcaway':ui.tcAway=null;render();break;
    case 'tcmode':ui.tcm=v==='max'?'max':parseInt(v,10);render();break;
    case 'tcbuy':{const b=TCB.find(x=>x.id===id),have=t.n[id]||0;let k=ui.tcm==='max'?tcMax(b,have,t.cash):ui.tcm;if(k<1)k=1;const c=tcCostK(b,have,k);if(t.cash<c)break;t.cash-=c;t.n[id]=have+k;tcDay();t.cd.buy[id]=(t.cd.buy[id]||0)+k;save();render();break;}
    case 'tcup':{const u=TCU.find(x=>x.id===id);if(!u||t.up[id]||t.cash<tcUc(u))break;t.cash-=tcUc(u);t.up[id]=1;save();render();break;}
    case 'tcbonus':if(tcBonusReady()){t.bn={d:dayKey(),until:now+3600000};save();toast('بونص الانضباط: دخلك ×2 لمدة ساعة');render();}break;
    case 'tcsb':{const s=TCS.find(x=>x.id===id),p=tcPrice(s,now);let k=v==='max'?Math.floor(t.cash/p):parseInt(v,10);if(k<1||t.cash<p*k)break;t.cash-=p*k;t.sh[id]=(t.sh[id]||0)+k;tcDay();t.cd.sh+=k;save();render();break;}
    case 'tcss':{const s=TCS.find(x=>x.id===id),p=tcPrice(s,now),h=t.sh[id]||0;let k=v==='all'?h:parseInt(v,10);k=Math.min(k,h);if(k<1)break;t.sh[id]=h-k;t.cash+=p*k;save();render();break;}
    case 'tcmg':{const b=TCB.find(x=>x.id===id),c=tcMc(b);if(t.mg[id]||t.cash<c)break;t.cash-=c;t.mg[id]=1;save();render();break;}
    case 'tcdb':{const d=TCD.find(x=>x.id===id),amt=Math.floor(t.cash*.25);if(!d||amt<100||t.bd.length>=3)break;t.cash-=amt;t.bd.push({k:id,amt,end:now+d.m*60000});save();render();break;}
    case 'tcdc':{const i=parseInt(v,10),x=t.bd[i];if(!x||now<x.end)break;const d=TCD.find(y=>y.id===x.k),r=x.amt*(1+d.r);t.cash+=r;t.bd.splice(i,1);toast('شهادة استحقت: +'+tcF(r-x.amt)+' ربح');save();render();break;}
    case 'tcperk':{const k=TCP.find(x=>x.id===id);if(!k||t.pr.sp[id]||t.pr.n-tcSp()<k.c)break;t.pr.sp[id]=1;save();render();break;}
    case 'tcmgon':t.mgOn=!t.mgOn;save();render();break;
    case 'tcdec':{
      const sl=tcDecSlot(now);if(t.dc.s===sl)break;const o=tcDecO();
      if(v==='safe'){t.cash+=o.safe;t.tot+=o.safe;t.life+=o.safe;toast('ربحت <span class="g">+'+tcF(o.safe)+'</span>');}
      else if(v==='risk'){if(Math.random()<.5){t.cash+=o.win;t.tot+=o.win;t.life+=o.win;toast('نجحت الصفقة <span class="g">+'+tcF(o.win)+'</span>');}else{const l=Math.min(t.cash,o.lose);t.cash-=l;toast('الصفقة وقعت: -'+tcF(l));}}
      else if(v==='boost'){if(t.cash<o.cost)break;t.cash-=o.cost;t.bx={u:now+600000,m:2};toast('دخلك ×2 لمدة 10 دقايق');}
      else break;
      t.dc.s=sl;t.dn++;save();render();break;}
    case 'tcvip':{
      const vs=tcVipSlot(now),i=parseInt(v,10),o=tcVipList(now)[i];
      if(!o||(t.vo.s===vs&&t.vo.d[i]))break;
      const it=tcVipPick(o);if(!it){toast('مفيش غرض مناسب');break;}
      if(it.r>=2&&ui.vc!==i){ui.vc=i;toast('اضغط تاني لتأكيد التسليم');render();break;}
      if(t.vo.s!==vs)t.vo={s:vs,d:{}};
      const g=ivNpc(it)*3;t.cash+=g;t.tot+=g;t.life+=g;t.vo.d[i]=1;S.inv.it=S.inv.it.filter(x=>x.id!==it.id);ui.vc=null;
      toast('العميل دفع <span class="g">+'+tcF(g)+'</span>');save();render();break;}
    case 'tcclaim':{const c=tcCon()[parseInt(v,10)];if(!c||c.have<c.need||t.cd.cl[c.i])break;t.cd.cl[c.i]=1;t.cash+=c.rew;toast('مكافأة العقد: +'+tcF(c.rew));save();render();break;}
    case 'tcprest':{const g=Math.floor(Math.sqrt(t.tot/1e6));if(g<1)break;if(!ui.tcPr){ui.tcPr=true;toast('اضغط تاني لتأكيد التأسيس الجديد');render();break;}ui.tcPr=false;t.pr.n+=g;t.cash=t.pr.sp.p1?5000:20;t.tot=0;t.n={};t.up={};t.sh={};t.mg={};save();toast('تأسيس جديد: +'+g+' سهم مؤسس');render();break;}
  }
}
function tcSpark(s,now){
  const pts=[];for(let i=30;i>=0;i--)pts.push(tcPrice(s,now-i*60000));
  const lo=Math.min(...pts),hi=Math.max(...pts),r=hi-lo||1;
  return '<svg viewBox="0 0 120 30" width="120" height="30" aria-hidden="true"><polyline fill="none" stroke="'+(pts[30]>=pts[29]?'var(--ok)':'var(--bad)')+'" stroke-width="1.6" points="'+pts.map((p,i)=>(i*4)+','+(28-(p-lo)/r*26)).join(' ')+'"/></svg>';
}

  const sg=[['biz','المشاريع'],['inv','الحقيبة ('+S.inv.it.length+')'],['mk','سوق اللاعبين']];

    return h+(ui.tcs==='inv'?vInv():(window.vMarket?vMarket():'<section class="panel"><div class="ptitle">سوق اللاعبين</div><p class="hint" style="margin:0">السوق شغال في نسخة الموقع الأونلاين بس (الرابط اللي بتفتحه من الكروم).</p></section>'));

/* ---------- merchant: decisions, VIP orders ---------- */
const TCDT=['مورّد جديد جاي لك بصفقة بضاعة بسعر الجملة.','صاحب محل جنبك عايز يبيع لك مخزونه بسرعة.','عميل كبير بيسأل عن طلبية ضخمة لو جهزتها.','إشاعة إن الأسعار هتغلى بكرة. تتحرك دلوقتي؟','شريك قديم رجع يعرض عليك مشروع مشترك.','تفتيش مفاجئ وممكن يطلع لك مخالفة. تتصرف إزاي؟'];
const TCVK={w:'سلاح',a:'درع',c:'تميمة',e:'إكسير',t:'ساعة التاجر',b:'صندوق التاجر'};
function tcDecO(){
  const inc=Math.max(1,tcInc(Date.now()));
  return {safe:Math.max(50,Math.round(inc*600)),win:Math.max(200,Math.round(inc*2400)),lose:Math.max(60,Math.round(inc*900)),cost:Math.max(20,Math.round(inc*300))};
}
function tcDecSlot(now){return Math.floor(now/1200000);}
function tcVipSlot(now){return Math.floor(now/10800000);}
function tcVipList(now){
  const sl=tcVipSlot(now);
  return [0,1].map(i=>({i,k:'wacetb'[rbH('vk'+sl+i)%6],r:rbH('vr'+sl+i)%3}));
}
function tcVipPick(o){
  return S.inv.it.filter(x=>x.k===o.k&&x.r>=o.r&&!ivWorn(x.id)).sort((a,b)=>a.r-b.r)[0];
}
function vTcPlay(now){
  const t=S.tc;let h='';
  const sl=tcDecSlot(now);
  if(t.dc.s!==sl){
    const o=tcDecO();
    h+='<section class="panel" style="border-color:var(--gold)"><div class="ptitle">قرار تاجر<span class="sp"></span><span class="side num">باقي '+N(Math.ceil(((sl+1)*1200000-now)/60000))+' دقيقة</span></div><p style="margin:0 0 10px">'+esc(TCDT[rbH('dc'+sl)%TCDT.length])+'</p>'
     +'<button class="btn block" data-act="tcdec" data-v="safe" style="margin-bottom:8px">تصرّف بحذر: +'+tcF(o.safe)+' مضمونة</button>'
     +'<button class="btn block" data-act="tcdec" data-v="risk" style="margin-bottom:8px">خاطر: 50% تكسب '+tcF(o.win)+' و50% تخسر '+tcF(o.lose)+'</button>'
     +'<button class="btn block" data-act="tcdec" data-v="boost"'+(t.cash>=o.cost?'':' disabled')+'>استثمر '+tcF(o.cost)+': دخلك ×2 لمدة 10 دقايق</button></section>';
  }
  if(t.bx.u>now)h+='<div class="proof" style="margin:0 0 12px;border-color:var(--ok)"><b style="color:var(--ok)">استثمارك شغّال</b> · دخلك ×'+t.bx.m+' · باقي '+N(Math.ceil((t.bx.u-now)/60000))+' دقيقة</div>';
  const vs=tcVipSlot(now);
  h+='<section class="panel"><div class="ptitle">طلبيات كبار العملاء<span class="sp"></span><span class="side num">تتجدد بعد '+N(Math.ceil(((vs+1)*10800000-now)/60000))+' دقيقة</span></div><p class="hint" style="margin:0 0 8px">سلّم غنيمة من حقيبتك وخد ×3 سعر بيعها للتاجر.</p>'
   +tcVipList(now).map(o=>{
     const done=t.vo.s===vs&&t.vo.d[o.i],it=tcVipPick(o),pay=it?ivNpc(it)*3:0;
     return '<div class="tcr"><div><div class="nmx">مطلوب: '+TCVK[o.k]+(o.r?' '+RAR[o.r].n+' أو أعلى':'')+'</div><div class="w">'+(done?'اتسلّمت':it?'عندك '+esc(itemName(it))+' بيدفعوا '+N(tcF(pay)):'مفيش عندك غرض مناسب')+'</div></div>'
     +(done?'':'<button class="btn sm fill" data-act="tcvip" data-v="'+o.i+'"'+(it?'':' disabled')+'>'+(ui.vc===o.i?'تأكيد':'سلّم')+'</button>')+'</div>';
   }).join('')+'</section>';
  return h;
}
function vTcBiz(){

  h+='<div class="chips" style="margin-bottom:10px">'+[1,10,100,'max'].map(k=>'<button class="chip" data-act="tcmode" data-v="'+k+'" aria-pressed="'+(mode===k)+'">'+(k==='max'?'أقصى':'×'+k)+'</button>').join('')+'</div>';
  h+='<section class="panel"><div class="ptitle">مشاريعك</div>'+TCB.map(b=>{

/* ---------- money: envelopes, goals, weekly review, deals ---------- */
const MVNS=['ترفيه','أخرى'];
function mvInit(){
  if(!S.mv||typeof S.mv!=='object')S.mv={};
  const m=S.mv;
  if(!m.lim||typeof m.lim!=='object')m.lim={};
  if(!m.closed||typeof m.closed!=='object')m.closed={};
  if(!Array.isArray(m.goals))m.goals=[];
  if(!m.ns||typeof m.ns!=='object')m.ns={};
  if(!m.rv||typeof m.rv!=='object')m.rv={};
  if(!Array.isArray(m.deals))m.deals=[];
}
const mvF=n=>fmt(Math.round(n));
function mvWk(d){const s=new Date((d||new Date()).getTime());s.setHours(12,0,0,0);s.setDate(s.getDate()-((s.getDay()+1)%7));return dayKey(s);}
function mvWkShift(k,n){const s=new Date(k+'T12:00:00');s.setDate(s.getDate()+n);return dayKey(s);}
const mvDaysIn=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
function mvPay(xp,label){const before=snap();S.entries.push({id:uid(),day:dayKey(),ts:Date.now(),kind:'money',stat:'money',xp,gold:Math.round(xp/2),label});gainToast(xp,Math.round(xp/2));celebrate(before);}
const mvOut=(a,b)=>S.ledger.filter(t=>t.type==='out'&&t.day>=a&&t.day<=b);
function mvEditable(m){const L=S.mv.lim[m]||{};return m===dayKey().slice(0,7)&&(!Object.keys(L).length||+dayKey().slice(8,10)<=5);}
function mvStreak(){let n=0,i=1;while(S.mv.ns[dayKey(daysAgo(i))]){n++;i++;}return n;}
function mvAvail(){const all=S.ledger.filter(t=>t.type==='save'||t.type==='inv').reduce((a,t)=>a+t.amt,0);return Math.max(0,all-S.mv.goals.reduce((a,g)=>a+g.saved,0));}
function mvHealth(){
  const m=dayKey().slice(0,7),sm=ledgerSum(m),ef=efInfo(),L=S.mv.lim[m]||{},ks=Object.keys(L).filter(k=>L[k]>0);
  const sr=sm.in>0?Math.min(1,((sm.save+sm.inv)/sm.in)/.2):0;
  const efr=ef.target>0?Math.min(1,ef.saved/ef.target):0;
  const er=ks.length?ks.filter(k=>(sm.cats[k]||0)<=L[k]).length/ks.length:0;
  const wk=mvWk(),hb=(S.mv.rv[wk]||S.mv.rv[mvWkShift(wk,-7)])?1:0,hn=Math.min(7,mvStreak())/7;
  const parts=[['الادخار',sr],['صندوق الطوارئ',efr],['التزام المظاريف',er],['العادات',(hb+hn)/2]];
  return {score:Math.round(parts.reduce((a,p)=>a+p[1]*25,0)),parts};
}

function mvClick(a,id,v){
  const f=ui.mv.f,t=dayKey(),m=t.slice(0,7);
  switch(a){
    case 'mvsub':ui.mn=v;render();break;
    case 'mvcopy':{const prev=Object.keys(S.mv.lim).sort().filter(k=>k<m&&Object.keys(S.mv.lim[k]).length).pop();if(!prev){toast('مفيش ميزانية قديمة تتنسخ');break;}S.mv.lim[m]=Object.assign({},S.mv.lim[prev]);save();render();break;}
    case 'mvlim':{
      if(!mvEditable(m)){toast('الميزانية اتقفلت للشهر ده');break;}
      const L=Object.assign({},S.mv.lim[m]||{});

      const kept=ks.filter(k=>(sm.cats[k]||0)<=L[k]).length,cnt=S.ledger.filter(x=>x.type==='out'&&monthOf(x.day)===id).length;
      let xp=0;if(cnt>=10&&ks.length)xp=Math.min(60,kept*8+(kept===ks.length&&ks.length>=3?20:0));
      S.mv.closed[id]={k:kept,n:ks.length,xp};if(xp)mvPay(xp,'قفلت ميزانية '+id+' · '+kept+' من '+ks.length+' مظروف سليم');
      else toast('مفيش XP: محتاج 10 مصاريف مسجّلة في الشهر على الأقل');save();render();break;}
    case 'mvgnew':ui.mv.gf=!ui.mv.gf;render();break;
    case 'mvgef':{const e=efInfo();if(!(e.target>0)){toast('سجّل مصاريف كام شهر الأول عشان نحسب صندوق الطوارئ');break;}f.gn='صندوق الطوارئ';f.ga=String(Math.round(e.target));f.gd=f.gd||'365';render();break;}
    case 'mvgd':f.gd=v;render();break;
    case 'mvgadd':{
      const n=(f.gn||'').trim(),amt=parseFloat(f.ga),days=parseInt(f.gd,10)||0;
      if(!n){toast('اكتب اسم الهدف');break;}if(!(amt>0)){toast('اكتب مبلغ الهدف');break;}if(days<14){toast('اختار مدة 14 يوم أو أكتر');break;}
      if(S.mv.goals.filter(g=>!g.done).length>=8){toast('عندك 8 أهداف شغّالة، خلّص واحد الأول');break;}
      const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);
      S.mv.goals.push({id:uid(),n:n.slice(0,40),amt:Math.round(amt),due:dayKey(d),start:t,saved:0,ms:[],done:0});ui.mv.gf=false;ui.mv.f={};save();render();break;}
    case 'mvgo':ui.mv.g=ui.mv.g===id?null:id;f.al='';render();break;
    case 'mvgal':{
      const g=S.mv.goals.find(x=>x.id===id),x=parseFloat(f.al);if(!g||g.done)break;
      if(!(x>0)){toast('اكتب المبلغ');break;}if(x>mvAvail()){toast('رصيد التوفير المسجّل في الدفتر مش كفاية. سجّل عملية توفير الأول');break;}
      const before=g.saved/g.amt;g.saved=Math.min(g.amt,g.saved+Math.round(x));const after=g.saved/g.amt;
      [[.25,10],[.5,15],[.75,20],[1,40]].forEach(p=>{if(before<p[0]&&after>=p[0]&&!g.ms.includes(p[0])){g.ms.push(p[0]);mvPay(p[1],'هدف «'+g.n+'» وصل '+Math.round(p[0]*100)+'%');}});
      if(after>=1)g.done=Date.now();f.al='';ui.mv.g=null;save();render();break;}

    case 'mvns':{
      const y=dayKey(daysAgo(1));if(S.mv.ns[y])break;
      if(mvOut(y,y).some(x=>MVNS.includes(x.sub))){toast('امبارح فيه مصروف ترفيه أو أخرى مسجّل');break;}
      S.mv.ns[y]=1;const s=mvStreak();let xp=3+(s===3?6:s===7?15:s===14?30:0);mvPay(xp,'يوم بلا إنفاق غير ضروري · '+s+' متتالي');save();render();break;}
    case 'mvrev':{
      const wk=mvWk(),a=(f.r1||'').trim(),b=(f.r2||'').trim(),c=(f.r3||'').trim();
      if(S.mv.rv[wk]){toast('راجعت الأسبوع ده');break;}
      const wo=S.ledger.filter(x=>x.day>=wk&&x.day<=mvWkShift(wk,6));
      if(wo.length<3){toast('سجّل 3 عمليات على الأقل في الأسبوع قبل المراجعة');break;}
      if(rbWords(a)<6||rbWords(b)<6||rbWords(c)<6){toast('كل إجابة 6 كلمات على الأقل');break;}
      let s=1,k=mvWkShift(wk,-7);while(S.mv.rv[k]){s++;k=mvWkShift(k,-7);}

    case 'mvkept':{const k=mvWkShift(mvWk(),-7);if(S.mv.rv[k]){S.mv.rv[k].kept=parseInt(v,10);save();render();}break;}
    case 'mvdnew':ui.mv.df=!ui.mv.df;render();break;
    case 'mvdadd':{

<script>
/* Standalone-only: player-to-player market for loot. Uses the same Firebase connection as the network.
   Listings live at mk/l/<id>; a buyer claims a listing by writing mk/l/<id>/b (first claim wins, enforced by rules). */
(function(){
"use strict";
const H=window.HUNTER;
if(!H||!H.db)return;
const FEE=.05,MAXL=8,PMAX=1e15;
const X={l:{},h:{},started:false,busy:{}};
window.HX=X;
const me=()=>H.db.uid(),isM=()=>H.state==='member';
function active(){return ui.tab==='gym'&&ui.field==='money'&&ui.mn==='game'&&ui.tcs==='mk';}
function typing(){const a=document.activeElement;return a&&a.id==='xmp';}
function rr(){if(active()&&!typing()&&!document.querySelector('#ov.on'))render();}
function start(){
  if(X.started||!isM()||!me())return;X.started=true;
  H.db.on('mk/l',v=>{X.l=v&&typeof v==='object'?v:{};reconcile();rr();});
  H.db.on('mk/h',v=>{X.h=v&&typeof v==='object'?v:{};rr();});
}
H.onChange(start);setTimeout(start,1800);
const nm=()=>String(S.name||'صياد').slice(0,20);
function trim(o){const k=Object.keys(o);if(k.length>300)k.sort().slice(0,k.length-300).forEach(x=>delete o[x]);}
function cleanItem(i){return {id:String(i.id||''),k:i.k,r:i.r|0,s:i.s,v:i.v|0,f:i.f|0};}
function valid(i){return i&&typeof i==='object'&&['w','a','c','e','t','b'].includes(i.k)&&i.r>=0&&i.r<=4&&typeof i.id==='string';}
/* settle finished trades on both sides; safe to run any number of times */
function reconcile(){
  const u=me(),I=S.inv;if(!u||!I||!S.tc)return;let ch=false;
  Object.keys(X.l).forEach(lid=>{
    const L=X.l[lid];if(!L||typeof L!=='object'||!L.b)return;
    if(L.b.u===u&&!I.got[lid]&&!X.busy[lid]&&valid(L.i)){
      I.got[lid]=1;ivAdd(cleanItem(L.i));S.tc.cash=Math.max(0,S.tc.cash-L.p);I.bought++;ch=true;
      toast('وصلك '+esc(itemName(L.i)));
      H.db.set('mk/l/'+lid+'/b/r',1).catch(()=>{});
    }
    if(L.s===u){
      if(!I.paid[lid]){
        I.paid[lid]=1;const g=Math.floor(L.p*(1-FEE));S.tc.cash+=g;S.tc.life+=g;I.sold++;ch=true;
        queue.push({k:'[ سوق اللاعبين ]',t:'اتباع غرضك',b:'+'+tcF(g),s:itemName(L.i)+' · اشتراه '+(L.b.n||'لاعب')});
      }
      if(L.b.r===1&&I.paid[lid]&&!X.busy['d'+lid]){X.busy['d'+lid]=1;H.db.set('mk/l/'+lid,null).catch(()=>{});}
    }
  });
  if(ch){trim(I.got);trim(I.paid);save();showNext();}
}
function parsePrice(s){
  s=String(s||'').trim().toLowerCase().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,،\s]/g,'').replace('٫','.');
  const m=/^(\d+(?:\.\d+)?)(k|m|b|t|qa)?$/.exec(s);if(!m)return NaN;
  const mul={k:1e3,m:1e6,b:1e9,t:1e12,qa:1e15}[m[2]]||1;return Math.round(parseFloat(m[1])*mul);
}
function medianFor(k,r){
  const a=Object.values(X.h).filter(x=>x&&x.k===k&&x.r===r&&x.p>0).sort((a,b)=>b.t-a.t).slice(0,9).map(x=>x.p).sort((a,b)=>a-b);
  return a.length?a[Math.floor(a.length/2)]:0;
}
function refPrice(it){return medianFor(it.k,it.r)||ivNpc(it)*3;}
async function listItem(){
  const x=ui.xm,I=S.inv,it=ivFind(x.sell),price=parsePrice(x.price);
  if(!it||ivWorn(it.id)){toast('الغرض مش متاح');x.sell=null;render();return;}
  if(!(price>=1&&price<=PMAX)){toast('اكتب سعر صح، مثلًا 5000 أو 20K أو 3M');return;}
  const mine=Object.values(X.l).filter(L=>L&&L.s===me()&&!L.b).length;
  if(mine>=MAXL){toast('وصلت للحد الأقصى: '+MAXL+' عروض');return;}
  const lid=H.db.key('mk/l'),L={s:me(),sn:nm(),p:price,t:Date.now(),i:cleanItem(it)};
  I.it=I.it.filter(z=>z.id!==it.id);x.sell=null;x.price='';save();render();
  try{await H.db.set('mk/l/'+lid,L);toast('اتعرض في السوق');}
  catch(e){I.it.push(it);save();render();toast('مقدرتش أعرضه. لازم تحدّث قواعد Firebase (اقرا الإرشادات).');}
}
async function buy(lid){
  const L=X.l[lid],I=S.inv;
  if(!L||L.b||L.s===me()||!valid(L.i)){toast('العرض ده مبقاش متاح');return;}
  if(S.tc.cash<L.p){toast('رصيدك مش كفاية');return;}
  if(I.it.length>=60){toast('الحقيبة مليانة. بيع حاجة الأول');return;}
  X.busy[lid]=1;I.got[lid]=1;ui.xm.conf=null;render();
  try{await H.db.set('mk/l/'+lid+'/b',{u:me(),n:nm(),t:Date.now()});}
  catch(e){delete I.got[lid];delete X.busy[lid];toast('اتباع لحد تاني قبلك أو اتلغى');render();return;}
  S.tc.cash=Math.max(0,S.tc.cash-L.p);ivAdd(cleanItem(L.i));I.bought++;save();
  delete X.busy[lid];render();
  toast('اشتريت '+esc(itemName(L.i)));
  H.db.set('mk/l/'+lid+'/b/r',1).catch(()=>{});
  H.db.set('mk/h/'+lid,{k:L.i.k,r:L.i.r|0,s:L.i.s,p:L.p,bn:nm(),sn:L.sn||'',t:Date.now()}).catch(()=>{});
}
async function cancel(lid){
  const L=X.l[lid];if(!L||L.s!==me())return;
  if(L.b){toast('اتباع خلاص');return;}
  try{await H.db.set('mk/l/'+lid,null);}catch(e){toast('اتباع قبل ما تلغيه');return;}
  if(valid(L.i))ivAdd(cleanItem(L.i));save();render();toast('رجع الغرض لحقيبتك');
